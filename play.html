<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>밤하늘 책방 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0b1033;--sky2:#1b1f5e;--sky3:#3a2a72;--gold:#ffd86b;--goldrgb:255,216,107;--text:#f3f0ff;--soft:#b9b4dc;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
p,h1,h2,h3,li,b{word-break:keep-all}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3));background-attachment:fixed;color:var(--text);font-family:'Gowun Dodum',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.back{background:none;border:none;color:var(--soft);font-size:15px;cursor:pointer;padding:6px 2px;text-decoration:none}
.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
h1{font-family:'Gowun Batang',serif;color:var(--gold);font-size:26px;margin:6px 0 6px}
.lead{color:var(--soft);font-size:15px;line-height:1.6;margin-bottom:18px}
.screen{display:none}.screen.on{display:block}
/* 놀이터 */
.games{display:grid;gap:12px}
.gcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;cursor:pointer}
.gcard:hover{border-color:rgba(var(--goldrgb),.6)}
.gcard .gart{width:76px;height:76px;flex:none;border-radius:16px;background:linear-gradient(160deg,#2b2f7a,#151a4a);display:flex;align-items:center;justify-content:center;overflow:hidden}
.gcard .gart svg{width:100%;height:100%}
.gcard h2{font-family:'Gowun Batang',serif;font-size:19px;color:var(--gold);margin-bottom:4px}
.gcard p{font-size:14px;color:var(--soft);line-height:1.5}
.gcard .best{font-size:13px;color:var(--text);margin-top:6px}
.gcard.soon{cursor:default;opacity:.55}
.gcard.soon:hover{border-color:var(--line)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(var(--goldrgb),.16);color:var(--gold);margin-left:6px;vertical-align:2px}
/* 게임 */
.stage{position:relative;width:100%;border-radius:20px;overflow:hidden;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;background:#0b1033}
canvas{display:block;width:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;font-family:'Gowun Batang',serif}
.hud .hearts{font-size:20px;letter-spacing:2px}
.hud .score{text-align:right;font-size:18px;color:var(--gold);line-height:1.2}
.hud .score small{display:block;font-size:12px;color:var(--soft)}
.hudbtns{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.hudbtns .iconbtn{background:rgba(11,16,51,.55);pointer-events:auto}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,8,30,.62)}
.overlay.on{display:flex}
.obox{width:100%;max-width:360px;background:linear-gradient(160deg,#252a6e,#141842);border:1px solid var(--line);border-radius:20px;padding:18px 16px;max-height:100%;overflow:auto}
.obox h3{font-family:'Gowun Batang',serif;color:var(--gold);font-size:21px;margin-bottom:8px}
.obox p{font-size:15px;line-height:1.65;color:var(--text)}
.obox .how{margin:10px 0 4px;padding-left:0;list-style:none;font-size:14px;color:var(--soft);line-height:1.7}
.obox .how li::before{content:'✦ ';color:var(--gold)}
.big{display:flex;gap:18px;margin:6px 0 10px;font-family:'Gowun Batang',serif}
.big div{font-size:14px;color:var(--soft)}
.big b{display:block;font-size:23px;color:var(--gold);font-weight:400}
.newrec{display:inline-block;font-size:12px;color:#1b1f5e;background:var(--gold);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:4px}
.prog{margin:8px 0 4px;font-size:13px;color:var(--soft)}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd86b,#ffb36b);border-radius:999px}
.found{margin-top:12px;display:grid;gap:10px}
.fb{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px}
.fb .fc{width:46px;height:66px;flex:none;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#5b3fa8,#2b1d63);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}
.fb .fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb .ft{flex:1;min-width:0}
.fb .ft b{display:block;font-family:'Gowun Batang',serif;font-weight:400;font-size:15px;line-height:1.35}
.fb .ft span{font-size:12px;color:var(--soft)}
.fb .fa{display:flex;flex-direction:column;gap:6px}
.sbtn{font-size:13px;padding:6px 10px;border-radius:999px;border:1.5px solid rgba(var(--goldrgb),.6);background:transparent;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text);text-align:center}
.sbtn.on{background:rgba(255,120,160,.2);border-color:#ff8fb1;color:#ffc1d4}
.row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;font-family:'Gowun Batang',serif;font-size:17px;padding:12px 10px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(135deg,#ffd86b,#ffb36b);color:#2a1d4a}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:rgba(11,16,51,.85);border:1px solid rgba(var(--goldrgb),.6);color:var(--gold);font-family:'Gowun Batang',serif;font-size:15px;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.hint{color:var(--soft);font-size:13px;text-align:center;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

  <!-- 놀이터 -->
  <section class="screen on" id="s-hub">
    <div class="top">
      <a class="back" href="nightbooks.html" id="tBack">← 책방으로</a>
      <button class="iconbtn" id="sndHub" aria-label="소리"></button>
    </div>
    <h1 id="tHub">🎮 밤하늘 놀이터</h1>
    <p class="lead" id="tLead">책방 친구들과 신나게 놀다 보면, 숨어 있던 책을 만날지도 몰라요!</p>
    <div class="games">
      <button class="gcard" id="gRun" onclick="openRun()">
        <div class="gart" id="artRun"></div>
        <div><h2 id="tRunName">토리의 달리기</h2><p id="tRunDesc">달 위의 책 길을 달리며 별을 모아요. 길게 누르면 높이, 공중에서 한 번 더 누르면 2단 점프!</p><div class="best" id="runBest"></div></div>
      </button>
      <div class="gcard soon">
        <div class="gart" id="artJump"></div>
        <div><h2><span id="tJumpName">반짝이의 책장 점프</span><span class="tag" id="tSoon1">곧 열려요</span></h2><p id="tJumpDesc">밤하늘에 떠 있는 책장을 밟고 깃발까지!</p></div>
      </div>
      <div class="gcard soon">
        <div class="gart" id="artIsle"></div>
        <div><h2><span id="tIsleName">둥실둥실 책 섬 탐험</span><span class="tag" id="tSoon2">곧 열려요</span></h2><p id="tIsleDesc">책 섬 곳곳에 숨은 별 5개를 찾아요.</p></div>
      </div>
    </div>
  </section>

  <!-- 토리의 달리기 -->
  <section class="screen" id="s-run">
    <div class="top">
      <button class="back" onclick="leaveRun()" id="tBackHub">← 놀이터로</button>
      <span></span>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud"><div class="hearts" id="hearts"></div><div class="score"><span id="sc">★ 0</span><small id="dist">0m</small></div></div>
      <div class="hudbtns"><button class="iconbtn" id="sndBtn" aria-label="소리"></button><button class="iconbtn" id="pauseBtn" aria-label="잠깐 멈춤">⏸</button></div>
      <div class="toast" id="toast"></div>
      <div class="overlay on" id="ovStart"><div class="obox">
        <h3 id="tStartT">토리의 달리기</h3>
        <p id="tStartP">토리가 달 위의 책 길을 달려요. 별을 모으고, 책 더미와 종이비행기는 피하세요!</p>
        <ul class="how" id="tHow"></ul>
        <div class="row"><button class="btn" id="startBtn" onclick="startRun()">달리기 시작!</button></div>
      </div></div>
      <div class="overlay" id="ovPause"><div class="obox">
        <h3 id="tPauseT">잠깐 쉬어 가요</h3>
        <div class="row"><button class="btn ghost" onclick="leaveRun()" id="tQuit">그만하기</button><button class="btn" onclick="resume()" id="tResume">계속 달리기</button></div>
      </div></div>
      <div class="overlay" id="ovOver"><div class="obox" id="overBox"></div></div>
    </div>
    <p class="hint" id="tHint">화면을 누르면 점프! 컴퓨터에서는 스페이스바나 ↑ 키도 돼요.</p>
  </section>
</div>

<script>
// ── 저장 (책방 앱과 같은 브라우저 저장소를 함께 써요) ──
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LANG=(()=>{try{const s=localStorage.getItem('starLang');if(s)return s}catch(e){}return (navigator.language||'ko').startsWith('ko')?'ko':'en'})();
const TX={
ko:{title:'밤하늘 책방 놀이터',back:'← 책방으로',backHub:'← 놀이터로',hub:'🎮 밤하늘 놀이터',lead:'책방 친구들과 신나게 놀다 보면, 숨어 있던 책을 만날지도 몰라요!',
runName:'토리의 달리기',runDesc:'달 위의 책 길을 달리며 별을 모아요. 길게 누르면 높이, 공중에서 한 번 더 누르면 2단 점프!',
jumpName:'반짝이의 책장 점프',jumpDesc:'밤하늘에 떠 있는 책장을 밟고 깃발까지!',isleName:'둥실둥실 책 섬 탐험',isleDesc:'책 섬 곳곳에 숨은 별 5개를 찾아요.',soon:'곧 열려요',
best:'최고 기록 ★ {s} · 모은 별 {t}개',noBest:'아직 기록이 없어요. 첫 기록을 세워 보세요!',
startP:'토리가 달 위의 책 길을 달려요. 별을 모으고, 책 더미와 종이비행기는 피하세요!',
how:['짧게 누르면 낮게, <b>길게 누르면 높이</b> 뛰어요','공중에서 한 번 더 누르면 <b>2단 점프</b>','💗 하트 별은 하트를, 🥕 당근 별은 잠깐 하늘을 나는 힘을 줘요','별을 100개 모을 때마다 <b>보너스 책</b>을 만나요'],
go:'달리기 시작!',pause:'잠깐 쉬어 가요',quit:'그만하기',resume:'계속 달리기',hint:'화면을 누르면 점프! 컴퓨터에서는 스페이스바나 ↑ 키도 돼요.',
overT:'수고했어요, 토리!',stars:'모은 별',dist:'달린 거리',bestL:'최고 기록',newRec:'새 기록!',
prog:'다음 보너스 책까지 별 {n}개',foundT:'보너스 책을 찾았어요!',add:'♡ 서재에 담기',added:'♥ 담음',view:'책방에서 보기',
again:'다시 달리기',toHub:'놀이터로',toastBook:'📖 보너스 책을 찾았어요!',toastFly:'🥕 하늘을 날아요!',toastHeart:'💗 하트 하나 더!',sound:'소리',m:'m'},
en:{title:'Night Sky Playground',back:'← Back to the shop',backHub:'← Playground',hub:'🎮 Night Sky Playground',lead:'Play with the bookshop friends, and you might discover a hidden book!',
runName:"Tori's Moon Run",runDesc:'Run along the book path on the moon and collect stars. Hold to jump higher, tap again in the air to double jump!',
jumpName:"Sparkle's Shelf Jump",jumpDesc:'Hop across floating bookshelves to the flag!',isleName:'Floating Book Island',isleDesc:'Find the five stars hidden around the island.',soon:'Coming soon',
best:'Best ★ {s} · {t} stars collected',noBest:'No record yet. Set your first one!',
startP:'Tori runs along the book path on the moon. Collect stars and dodge the book piles and paper planes!',
how:['Tap for a small jump, <b>hold to jump higher</b>','Tap again in the air to <b>double jump</b>','💗 Heart stars give a heart, 🥕 carrot stars let you fly for a moment','Every 100 stars, you discover a <b>bonus book</b>'],
go:'Start running!',pause:'Taking a break',quit:'Quit',resume:'Keep running',hint:'Tap the screen to jump! On a computer, Space or ↑ works too.',
overT:'Nice run, Tori!',stars:'Stars',dist:'Distance',bestL:'Best',newRec:'New record!',
prog:'{n} more stars to the next bonus book',foundT:'You found bonus books!',add:'♡ Add to library',added:'♥ Added',view:'See in the shop',
again:'Run again',toHub:'Playground',toastBook:'📖 You found a bonus book!',toastFly:'🥕 Flying!',toastHeart:'💗 One more heart!',sound:'Sound',m:'m'}};
const T=(k,v)=>{let s=(TX[LANG]||TX.ko)[k];if(s==null)s=TX.ko[k];if(v&&typeof s==='string')for(const a in v)s=s.split('{'+a+'}').join(v[a]);return s};
function applyText(){
  document.documentElement.lang=LANG;document.title=T('title');
  const set=(id,k)=>{const e=document.getElementById(id);if(e)e.textContent=T(k)};
  set('tBack','back');set('tBackHub','backHub');set('tHub','hub');set('tLead','lead');set('tRunName','runName');set('tRunDesc','runDesc');
  set('tJumpName','jumpName');set('tJumpDesc','jumpDesc');set('tIsleName','isleName');set('tIsleDesc','isleDesc');set('tSoon1','soon');set('tSoon2','soon');
  set('tStartT','runName');set('tStartP','startP');set('startBtn','go');set('tPauseT','pause');set('tQuit','quit');set('tResume','resume');set('tHint','hint');
  document.getElementById('tHow').innerHTML=T('how').map(h=>`<li>${h}</li>`).join('');
  drawBest();
}

// ── 소리 (짧은 효과음만) ──
let soundOn=LS.get('starPlaySound',true), actx=null;
function sndIcon(){const i=soundOn?'🔊':'🔇';['sndHub','sndBtn'].forEach(id=>{const b=document.getElementById(id);b.textContent=i;b.setAttribute('aria-label',T('sound')+(soundOn?' ON':' OFF'))})}
function toggleSound(){soundOn=!soundOn;LS.set('starPlaySound',soundOn);sndIcon();if(soundOn)beep('star')}
document.getElementById('sndHub').onclick=toggleSound;document.getElementById('sndBtn').onclick=e=>{e.stopPropagation();toggleSound()};
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(f1,f2,dur,type,vol,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.07,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02)}
function beep(k){if(!soundOn)return;
  if(k==='jump')tone(380,620,0.12,'triangle',0.06);
  else if(k==='jump2')tone(520,900,0.12,'triangle',0.06);
  else if(k==='star')tone(1320,1760,0.09,'sine',0.05);
  else if(k==='heart'){tone(660,0,0.12,'sine',0.06);tone(880,0,0.16,'sine',0.06,0.1)}
  else if(k==='carrot'){[523,659,784,1047].forEach((f,i)=>tone(f,0,0.1,'triangle',0.05,i*0.07))}
  else if(k==='hit')tone(220,90,0.25,'sawtooth',0.05);
  else if(k==='book'){[784,988,1175,1568].forEach((f,i)=>tone(f,0,0.14,'sine',0.06,i*0.09))}
  else if(k==='over'){[523,440,349].forEach((f,i)=>tone(f,0,0.18,'triangle',0.05,i*0.14))}
}

// ── 책 데이터: 책방 앱 파일에서 읽어 와요 (보너스 책용) ──
let BOOKS=null;
async function loadBooks(){
  try{
    const r=await fetch('nightbooks.html',{cache:'no-cache'}); const s=await r.text();
    const grab=(name,endTok)=>{const a=s.indexOf('const '+name+' = ');if(a<0)return null;const st=a+('const '+name+' = ').length;const e=s.indexOf(endTok,st);return s.slice(st,e+endTok.length-1)};
    const raw=Function('return '+grab('RAW','\n];'))();
    const en=Function('return '+(()=>{const a=s.indexOf('const EN_BOOKS = ');const e=s.indexOf('\n',a);return s.slice(a+17,e).replace(/;\s*$/,'')})())();
    const cov=Function('return '+(()=>{const a=s.indexOf('const COVERS = ');const e=s.indexOf('\n',a);return s.slice(a+15,e).replace(/;\s*$/,'')})())();
    BOOKS=raw.map((r,i)=>({id:i,tk:r[0],ak:r[1],e:r[6],te:(en[i]||[])[0]||r[0],ae:(en[i]||[])[1]||r[1],cov:cov[i]||null}));
  }catch(e){BOOKS=null}
}

// ── 놀이터 ──
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
let play=LS.get('starPlay',{runBest:0,runTotal:0,found:[]});
if(!play.found)play.found=[];
function drawBest(){document.getElementById('runBest').textContent=play.runBest?T('best',{s:play.runBest,t:play.runTotal}):T('noBest')}
function artSVG(kind){
  const stars='<circle cx="14" cy="14" r="1.4" fill="#fff" opacity=".8"/><circle cx="60" cy="10" r="1.2" fill="#fff" opacity=".7"/><circle cx="66" cy="30" r="1" fill="#fff" opacity=".6"/>';
  if(kind==='run')return `<svg viewBox="0 0 76 76">${stars}<path d="M54 12a10 10 0 1 0 8 16 8 8 0 1 1-8-16z" fill="#ffe9a8"/>
    <rect x="0" y="58" width="76" height="18" fill="#2a1f4a"/>${[0,11,22,33,44,55,66].map((x,i)=>`<rect x="${x}" y="${52+(i%3)*2}" width="10" height="${10-(i%3)*2}" rx="1.5" fill="${['#5b3fa8','#3f9a6b','#b5562f','#2f5fa8','#f0a93b','#6a5a8e','#1f6f8b'][i]}"/>`).join('')}
    <g transform="translate(30 30)">${toriSVG()}</g></svg>`;
  if(kind==='jump')return `<svg viewBox="0 0 76 76">${stars}<rect x="6" y="54" width="22" height="7" rx="2" fill="#7d5a3a"/><rect x="44" y="40" width="24" height="7" rx="2" fill="#7d5a3a"/>
    <path d="M60 18 l0 22" stroke="#ffd86b" stroke-width="2"/><path d="M60 18 l10 4 -10 4z" fill="#ff8fb1"/>${starPath(26,34,10,'#ffd86b')}<circle cx="23" cy="33" r="1" fill="#2a1d4a"/><circle cx="29" cy="33" r="1" fill="#2a1d4a"/></svg>`;
  return `<svg viewBox="0 0 76 76">${stars}<ellipse cx="38" cy="54" rx="28" ry="10" fill="#3f9a6b"/><ellipse cx="38" cy="58" rx="22" ry="8" fill="#2a1f4a"/>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
let W=360,H=420,DPR=1,GROUND=360;
function resize(){

  DPR=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.height=H+'px';

window.addEventListener('resize',()=>{if(document.getElementById('s-run').classList.contains('on')){resize();if(!G||!G.running)draw()}});

const SPINE=['#5b3fa8','#3f9a6b','#b5562f','#2f5fa8','#f0a93b','#6a5a8e','#1f6f8b','#9a6a3a','#7d9a3a','#3d7a8a'];
const rnd=(a,b)=>a+Math.random()*(b-a);
let G=null, raf=0, last=0, held=false;
function newGame(){
  const g={running:false,over:false,t:0,cam:0,speed:230,hearts:3,stars:0,inv:0,fly:0,
    p:{x:0,y:GROUND-26,vy:0,ground:true,jumps:0,hold:0,coyote:0,buffer:0,squash:0},
    plats:[],haz:[],items:[],parts:[],nextX:0,bg:[],shelves:[],startTotal:play.runTotal,foundNow:[],sinceHeart:0};
  g.plats.push({x:-200,w:W+520});g.nextX=W+320;
  for(let i=0;i<70;i++)g.bg.push({x:Math.random()*W,y:Math.random()*(H*0.62),r:Math.random()*1.4+0.3,ph:Math.random()*6,d:Math.random()<.5?0.08:0.18});
  for(let i=0;i<8;i++)g.shelves.push({x:i*120,h:rnd(40,90),w:rnd(70,110)});

}
function gen(g){
  while(g.nextX<g.cam+W*2.2){
    const diff=Math.min(1,g.t/90);
    const gapMax=Math.min(60+g.speed*0.30,170);
    const gap=g.t<3?0:(Math.random()<0.55+diff*0.25?rnd(56,gapMax):0);
    if(gap){ // 틈 위로 별 아치
      const n=Math.floor(gap/26)+2;for(let i=0;i<n;i++){const f=(i+1)/(n+1);g.items.push({k:'star',x:g.nextX+gap*f,y:GROUND-30-Math.sin(f*Math.PI)*90})}
    }
    const x=g.nextX+gap, w=rnd(300,620)-diff*120;
    g.plats.push({x,w});
    // 위험물과 별
    let cx=x+120;
    while(cx<x+w-90){
      const r=Math.random();
      if(r<0.30+diff*0.15&&g.t>2){g.haz.push({k:'stack',x:cx,w:30,h:rnd(26,46+diff*22),c:Math.floor(Math.random()*10)});
        const n=3;for(let i=0;i<n;i++)g.items.push({k:'star',x:cx-30+i*30+15,y:GROUND-90-(i===1?18:0)});cx+=rnd(170,260)}
      else if(r<0.45+diff*0.2&&g.t>8){g.haz.push({k:'plane',x:cx+W*0.6,y:GROUND-rnd(58,105),vx:-rnd(70,140)-diff*60,bob:Math.random()*6});cx+=rnd(180,260)}
      else{const n=Math.floor(rnd(3,6)),hy=Math.random()<0.4?rnd(70,130):24;for(let i=0;i<n;i++)g.items.push({k:'star',x:cx+i*26,y:GROUND-hy});cx+=n*26+rnd(90,160)}
    }
    g.sinceHeart++;
    if(g.hearts<3&&g.sinceHeart>3&&Math.random()<0.35){g.items.push({k:'heart',x:x+w*0.5,y:GROUND-120});g.sinceHeart=0}
    else if(g.t>12&&Math.random()<0.12)g.items.push({k:'carrot',x:x+w*0.6,y:GROUND-115});
    g.nextX=x+w;
  }
  const L=g.cam-260;
  g.plats=g.plats.filter(p=>p.x+p.w>L);g.haz=g.haz.filter(h=>h.x+60>L);g.items=g.items.filter(i=>i.x>L&&!i.got);g.parts=g.parts.filter(p=>p.life>0);
}
function onGround(g,wx){return g.plats.some(p=>wx>=p.x-2&&wx<=p.x+p.w+2)}

// 입력
function press(){
  if(!G||!G.running)return;
  held=true;const p=G.p;
  if(G.fly>0){p.vy=Math.min(p.vy,-260);return}
  if(p.ground||p.coyote>0){doJump(1)}
  else if(p.jumps<2){doJump(2)}
  else p.buffer=0.12;
}
function release(){held=false}
function doJump(n){const p=G.p;p.vy=n===1?-560:-520;p.ground=false;p.coyote=0;p.jumps=n;p.hold=0;p.squash=0.12;beep(n===1?'jump':'jump2');
  for(let i=0;i<5;i++)G.parts.push({x:p.x+G.cam-6,y:p.y+12,vx:rnd(-60,20),vy:rnd(-60,-10),life:0.4,c:'#ffe9a8',r:2})}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();ac();press()});
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{
  if(!document.getElementById('s-run').classList.contains('on'))return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(e.repeat)return;ac();
    if(G&&G.running)press();else if(document.getElementById('ovStart').classList.contains('on'))startRun();else if(document.getElementById('ovPause').classList.contains('on'))resume()}
  else if(e.code==='Escape'||e.code==='KeyP'){if(G&&G.running)pause();else if(document.getElementById('ovPause').classList.contains('on'))resume()}
});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release()});
document.getElementById('pauseBtn').onclick=e=>{e.stopPropagation();if(G&&G.running)pause()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.running)pause()});

function hurt(g,fall){
  if(!fall&&(g.inv>0||g.fly>0))return;
  if(!(fall&&g.inv>0)){g.hearts--;beep('hit');shake=0.25;if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}}
  g.inv=1.6;
  if(g.hearts<=0){endRun();return}
  if(fall){ // 다음 땅 위로 다시 올려 줘요
    const wx=g.p.x+g.cam;const next=g.plats.find(p=>p.x+p.w>wx+20)||g.plats[g.plats.length-1];
    g.cam=Math.max(g.cam,next.x+10-g.p.x);g.p.y=GROUND-120;g.p.vy=-120;g.p.jumps=1;g.p.ground=false;
  }
}
let shake=0;
function addStar(g,n){
  const before=Math.floor((g.startTotal+g.stars)/100);g.stars+=n;const after=Math.floor((g.startTotal+g.stars)/100);
  if(after>before)for(let i=before;i<after;i++)findBook(g);
}
function findBook(g){
  if(!BOOKS)return;
  const likes=new Set(LS.get('starLikes',[])),readM=LS.get('starRead',{}),nope=new Set(LS.get('starNope',[]));
  const seen=new Set([...play.found,...g.foundNow]);
  let pool=BOOKS.filter(b=>!likes.has(b.id)&&!readM[b.id]&&!nope.has(b.id)&&!seen.has(b.id));
  if(!pool.length)pool=BOOKS.filter(b=>!seen.has(b.id));if(!pool.length)return;
  const b=pool[Math.floor(Math.random()*pool.length)];g.foundNow.push(b.id);beep('book');toast(T('toastBook'));
}
let toastT=0;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1400)}

function update(dt){
  const g=G,p=g.p;g.t+=dt;
  g.speed=Math.min(230+g.t*4.2,520);
  if(g.fly>0)g.speed=Math.max(g.speed,330);
  g.cam+=g.speed*dt;
  gen(g);
  // 점프 물리
  if(g.fly>0){
    g.fly-=dt;p.vy+= (held?-900:520)*dt;p.vy=Math.max(-300,Math.min(260,p.vy));p.y+=p.vy*dt;
    p.y=Math.max(60,Math.min(GROUND-26,p.y));if(p.y>=GROUND-26){p.vy=0}
    if(Math.random()<0.6)g.parts.push({x:p.x+g.cam-14,y:p.y+8,vx:-40,vy:rnd(-20,20),life:0.5,c:'#ffb36b',r:2.2});
    if(g.fly<=0){p.ground=false;p.jumps=1;g.inv=Math.max(g.inv,0.8)}
  }else{
    let grav=2100;
    if(held&&p.vy<0&&p.hold<0.24){grav*=0.42;p.hold+=dt}
    if(!held)p.hold=1;
    const prevY=p.y;p.vy+=grav*dt;p.y+=p.vy*dt;
    const wx=p.x+g.cam;
    if(p.y>=GROUND-26&&p.vy>=0){
      if(onGround(g,wx)&&prevY<=GROUND-24){p.y=GROUND-26;if(!p.ground){p.squash=0.1}p.vy=0;p.ground=true;p.jumps=0;
        if(p.buffer>0){p.buffer=0;doJump(1)}}
      else{if(p.ground)p.coyote=0.08;p.ground=false}
    }else if(p.ground&&!onGround(g,wx)){p.ground=false;p.coyote=0.08}
    if(p.coyote>0)p.coyote-=dt;if(p.buffer>0)p.buffer-=dt;
    if(p.y>H+40)hurt(g,true);
  }
  if(p.squash>0)p.squash-=dt;
  if(g.inv>0)g.inv-=dt;if(shake>0)shake-=dt;
  // 부딪힘
  const px=p.x+g.cam, py=p.y;
  for(const h of g.haz){
    if(h.k==='plane'){h.x+=h.vx*dt;h.bob+=dt*4}
    let hx,hy,hw,hh;
    if(h.k==='stack'){hx=h.x+3;hw=h.w-6;hy=GROUND-h.h+4;hh=h.h}
    else{hx=h.x-12;hw=24;hy=h.y-6+Math.sin(h.bob)*4;hh=12}
    if(px+10>hx&&px-12<hx+hw&&py+20>hy&&py-14<hy+hh)hurt(g,false);
  }
  for(const it of g.items){
    if(it.got)continue;const dx=it.x-px,dy=it.y-(py+2);
    const R=g.fly>0?34:22;
    if(dx*dx+dy*dy<R*R){it.got=true;
      if(it.k==='star'){addStar(g,1);beep('star');for(let i=0;i<4;i++)g.parts.push({x:it.x,y:it.y,vx:rnd(-80,80),vy:rnd(-90,30),life:0.35,c:'#ffd86b',r:1.8})}
      else if(it.k==='heart'){g.hearts=Math.min(3,g.hearts+1);beep('heart');toast(T('toastHeart'))}
      else if(it.k==='carrot'){g.fly=4.5;beep('carrot');toast(T('toastFly'));p.vy=-300;p.ground=false;
        for(let i=0;i<14;i++)g.items.push({k:'star',x:px+260+i*34,y:Math.max(80,GROUND-150-Math.sin(i/2)*60)})}
    }
  }
  for(const q of g.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.life-=dt}
  hud();
}
function hud(){
  const g=G;document.getElementById('hearts').textContent='💗'.repeat(Math.max(0,g.hearts))+'🤍'.repeat(3-Math.max(0,g.hearts));
  document.getElementById('sc').textContent='★ '+g.stars;document.getElementById('dist').textContent=Math.floor(g.cam/40)+T('m');
}

// 그리기
function star(x,y,r,fill,rot){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawTori(x,y,g){
  const p=g.p;const t=g.t;
  if(g.inv>0&&Math.floor(g.inv*12)%2===0&&g.fly<=0)return;
  ctx.save();ctx.translate(x,y);
  const run=p.ground&&g.fly<=0;const bob=run?Math.abs(Math.sin(t*16))*-3:0;
  const sq=p.squash>0?1-p.squash*1.5:1;ctx.translate(0,bob);ctx.scale(1/sq*0.98+0.02,sq);
  // 당근 날개
  if(g.fly>0){ctx.fillStyle='rgba(255,179,107,.9)';ctx.beginPath();ctx.ellipse(-6,-2,14,6,-0.5+Math.sin(t*20)*0.3,0,Math.PI*2);ctx.fill()}
  const earTilt=p.ground?Math.sin(t*16)*0.12:(p.vy<0?0.55:0.25);
  // 귀
  for(const [ex,base] of [[2,-0.18],[9,0.22]]){ctx.save();ctx.translate(ex,-4);ctx.rotate(base-earTilt);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-11,3.6,11,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffc1d4';ctx.beginPath();ctx.ellipse(0,-11,1.7,7.5,0,0,Math.PI*2);ctx.fill();ctx.restore()}
  // 몸
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-2,12,13,10,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-14,11,4.5,0,Math.PI*2);ctx.fill();
  // 다리
  ctx.fillStyle='#f1ecff';const lg=run?Math.sin(t*16)*4:2;
  ctx.beginPath();ctx.ellipse(-7+lg,21,4.5,3,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(4-lg,21,4.5,3,0,0,Math.PI*2);ctx.fill();
  // 머리
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,2,9.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a1d4a';
  if(g.inv>0&&g.fly<=0){ctx.fillRect(4,0.5,2.6,1.2);ctx.fillRect(9.4,0.5,2.6,1.2)}
  else{ctx.beginPath();ctx.arc(5.2,1.5,1.25,0,Math.PI*2);ctx.arc(10.6,1.5,1.25,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='rgba(255,170,200,.85)';ctx.beginPath();ctx.arc(13,5.5,1.9,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function draw(){
  const g=G;if(!g)return;
  ctx.save();
  if(shake>0)ctx.translate(rnd(-3,3),rnd(-3,3));
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0b1033');sky.addColorStop(0.65,'#1b1f5e');sky.addColorStop(1,'#3a2a72');
  ctx.fillStyle=sky;ctx.fillRect(-5,-5,W+10,H+10);
  // 별
  for(const s of g.bg){const x=((s.x-g.cam*s.d)%W+W)%W;ctx.globalAlpha=0.45+0.45*Math.sin(g.t*2+s.ph);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,s.y,s.r,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  // 달
  const mx=W-62,my=64;ctx.fillStyle='rgba(255,233,168,.12)';ctx.beginPath();ctx.arc(mx,my,40,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(mx,my,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1b1f5e';ctx.beginPath();ctx.arc(mx+11,my-7,21,0,Math.PI*2);ctx.fill();
  // 먼 책장 그림자
  ctx.fillStyle='rgba(42,31,90,.75)';
  for(const s of g.shelves){const span=g.shelves.length*120;const x=((s.x-g.cam*0.3)%span+span)%span-120;
    for(let i=0;i<5;i++){const bh=s.h-(i%3)*8;ctx.fillRect(x+i*(s.w/5),GROUND-bh+10,s.w/5-2,bh)}}
  // 땅(책등 길)
  for(const p of g.plats){
    const x0=p.x-g.cam;if(x0>W+20||x0+p.w<-20)continue;
    ctx.fillStyle='#2a1f4a';ctx.fillRect(x0,GROUND+4,p.w,H-GROUND);
    let bx=x0,k=Math.floor(Math.abs(p.x)/7);
    ctx.save();ctx.beginPath();ctx.rect(x0,0,p.w,H);ctx.clip();
    while(bx<x0+p.w){const bw=9+((k*7)%9),bh=14+((k*5)%10);if(bx+bw>-10&&bx<W+10){
      ctx.fillStyle=SPINE[k%SPINE.length];rr(bx,GROUND+20-bh,bw-1.5,bh+40,2);ctx.fill();
      ctx.fillStyle='rgba(255,216,107,.55)';ctx.fillRect(bx+1.5,GROUND+24-bh,bw-4.5,1.6);ctx.fillRect(bx+1.5,GROUND+28-bh,bw-4.5,1)}
      bx+=bw;k++}
    ctx.restore();
    ctx.fillStyle='rgba(255,216,107,.35)';ctx.fillRect(x0,GROUND+4,p.w,1.5);
  }
  // 아이템
  for(const it of g.items){if(it.got)continue;const x=it.x-g.cam;if(x<-20||x>W+20)continue;const y=it.y+Math.sin(g.t*4+it.x*0.05)*3;
    if(it.k==='star'){ctx.fillStyle='rgba(255,216,107,.18)';ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();star(x,y,8,'#ffd86b',Math.sin(g.t*3+it.x)*0.2)}
    else if(it.k==='heart'){ctx.fillStyle='rgba(255,143,177,.25)';ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff8fb1';ctx.beginPath();ctx.moveTo(x,y+8);ctx.bezierCurveTo(x-14,y-2,x-7,y-13,x,y-5);ctx.bezierCurveTo(x+7,y-13,x+14,y-2,x,y+8);ctx.fill()}
    else{ctx.fillStyle='rgba(255,179,107,.25)';ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.translate(x,y);ctx.rotate(0.6);ctx.fillStyle='#ff9a3c';ctx.beginPath();ctx.moveTo(-4,-7);ctx.lineTo(4,-7);ctx.lineTo(0,10);ctx.closePath();ctx.fill();
      ctx.fillStyle='#5fbf6a';ctx.beginPath();ctx.ellipse(-3,-10,2,4,-0.5,0,Math.PI*2);ctx.ellipse(3,-10,2,4,0.5,0,Math.PI*2);ctx.fill();ctx.restore();star(x+11,y-10,4,'#ffd86b')}
  }
  // 위험물
  for(const h of g.haz){const x=h.x-g.cam;if(x<-60||x>W+60)continue;
    if(h.k==='stack'){let y=GROUND+4,i=0;while(y>GROUND+4-h.h){const bh=Math.min(10+((i*3+h.c)%5),y-(GROUND+4-h.h));const off=((i+h.c)%3-1)*2.5;
      ctx.fillStyle=SPINE[(h.c+i*3)%SPINE.length];rr(x+off,y-bh,h.w,bh-1,2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(x+off+h.w-5,y-bh+2,3,bh-5);y-=bh;i++}}
    else{const y=h.y+Math.sin(h.bob)*4;ctx.fillStyle='#f3f0ff';ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+12,y-7);ctx.lineTo(x+4,y+1);ctx.closePath();ctx.fill();
      ctx.fillStyle='#c9c3ea';ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+4,y+1);ctx.lineTo(x-2,y+7);ctx.closePath();ctx.fill()}}
  // 반짝이 조각
  for(const q of g.parts){ctx.globalAlpha=Math.max(0,q.life*2.4);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x-g.cam,q.y,q.r,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  // 토리 그림자 + 토리
  if(g.p.y<GROUND&&onGround(g,g.p.x+g.cam)){const d=Math.max(0,GROUND-26-g.p.y);ctx.fillStyle='rgba(0,0,0,'+(0.28-Math.min(d,200)/900)+')';ctx.beginPath();ctx.ellipse(g.p.x-2,GROUND+6,14-Math.min(d,140)/18,3,0,0,Math.PI*2);ctx.fill()}
  drawTori(g.p.x,g.p.y,g);
  ctx.restore();
}
function loop(ts){
  if(!G||!G.running)return;
  const dt=Math.min(0.033,(ts-last)/1000||0.016);last=ts;
  update(dt);if(G&&G.running)draw();
  raf=requestAnimationFrame(loop);
}
function openRun(){go('s-run');resize();G=newGame();draw();hud();showOv('ovStart')}
function showOv(id){['ovStart','ovPause','ovOver'].forEach(o=>document.getElementById(o).classList.toggle('on',o===id))}
function startRun(){ac();resize();G=newGame();G.running=true;showOv(null);held=false;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function pause(){if(!G||!G.running)return;G.running=false;held=false;showOv('ovPause')}
function resume(){if(!G||G.over)return;G.running=true;showOv(null);last=performance.now();raf=requestAnimationFrame(loop)}
function leaveRun(){if(G)G.running=false;cancelAnimationFrame(raf);showOv(null);drawBest();go('s-hub')}
function endRun(){
  const g=G;g.running=false;g.over=true;cancelAnimationFrame(raf);beep('over');draw();
  const isNew=g.stars>play.runBest&&g.stars>0;
  play.runBest=Math.max(play.runBest,g.stars);play.runTotal=g.startTotal+g.stars;
  play.found=[...play.found,...g.foundNow];LS.set('starPlay',play);
  const left=100-(play.runTotal%100);
  const likes=new Set(LS.get('starLikes',[]));
  const fb=g.foundNow.map(id=>{const b=BOOKS&&BOOKS[id];if(!b)return '';const t=LANG==='en'?b.te:b.tk,a=LANG==='en'?b.ae:b.ak;
    return `<div class="fb"><div class="fc">${b.e}${b.cov?`<img src="${b.cov}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
      <div class="ft"><b>${esc(t)}</b><span>${esc(a)}</span></div>
      <div class="fa"><button class="sbtn ${likes.has(id)?'on':''}" onclick="addLib(${id},this)">${likes.has(id)?T('added'):T('add')}</button><a class="sbtn" href="nightbooks.html?book=${id}">${T('view')}</a></div></div>`}).join('');
  document.getElementById('overBox').innerHTML=`<h3>${T('overT')}</h3>
    <div class="big"><div>${T('stars')}<b>★ ${g.stars}${isNew?`<span class="newrec">${T('newRec')}</span>`:''}</b></div><div>${T('dist')}<b>${Math.floor(g.cam/40)}${T('m')}</b></div></div>
    <p class="prog">${T('bestL')} ★ ${play.runBest}</p>
    <div class="prog">${T('prog',{n:left})}<div class="bar"><i style="width:${(play.runTotal%100)}%"></i></div></div>
    ${fb?`<p style="margin-top:14px;font-family:'Gowun Batang',serif;color:var(--gold)">${T('foundT')}</p><div class="found">${fb}</div>`:''}
    <div class="row"><button class="btn ghost" onclick="leaveRun()">${T('toHub')}</button><button class="btn" onclick="startRun()">${T('again')}</button></div>`;
  showOv('ovOver');
}
function addLib(id,btn){const l=new Set(LS.get('starLikes',[]));if(l.has(id))l.delete(id);else l.add(id);LS.set('starLikes',[...l]);
  btn.classList.toggle('on',l.has(id));btn.textContent=l.has(id)?T('added'):T('add')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

applyText();sndIcon();loadBooks();
if(location.hash==='#run')openRun();
</script>
