<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>밤하늘 책방 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0b1033;--sky2:#1b1f5e;--sky3:#3a2a72;--gold:#ffd86b;--goldrgb:255,216,107;--text:#f3f0ff;--soft:#b9b4dc;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
p,h1,h2,h3,li,b{word-break:keep-all}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3));background-attachment:fixed;color:var(--text);font-family:'Gowun Dodum',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.back{background:none;border:none;color:var(--soft);font-size:15px;cursor:pointer;padding:6px 2px;text-decoration:none}
.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
h1{font-family:'Gowun Batang',serif;color:var(--gold);font-size:25px;margin:4px 0 6px}
.lead{color:var(--soft);font-size:15px;line-height:1.6;margin-bottom:16px}
.screen{display:none}.screen.on{display:block}
.wallet{font-family:'Gowun Batang',serif;color:var(--gold);font-size:16px;background:rgba(var(--goldrgb),.12);border:1px solid rgba(var(--goldrgb),.35);border-radius:999px;padding:4px 12px}
/* 놀이터 */
.games{display:grid;gap:12px}
.gcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;cursor:pointer}
.gcard:hover{border-color:rgba(var(--goldrgb),.6)}
.gcard .gart{width:76px;height:76px;flex:none;border-radius:16px;background:linear-gradient(160deg,#2b2f7a,#151a4a);display:flex;align-items:center;justify-content:center;overflow:hidden}
.gcard .gart svg{width:100%;height:100%}
.gcard h2{font-family:'Gowun Batang',serif;font-size:19px;color:var(--gold);margin-bottom:4px}
.gcard p{font-size:14px;color:var(--soft);line-height:1.5}
.gcard .best{font-size:13px;color:var(--text);margin-top:6px}
.gcard.soon{cursor:default;opacity:.55}
.gcard.soon:hover{border-color:var(--line)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(var(--goldrgb),.16);color:var(--gold);margin-left:6px;vertical-align:2px}
/* 지도 */
.map{position:relative;height:380px;border-radius:22px;border:1px solid var(--line);background:radial-gradient(120% 80% at 50% 110%,#3a2a72 0%,#1b1f5e 55%,#0e1340 100%);overflow:hidden;margin-bottom:14px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;width:120px}
.node .dot{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Gowun Batang',serif;font-size:17px;color:#2a1d4a;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffd86b 55%,#e8a948);box-shadow:0 0 0 4px rgba(var(--goldrgb),.18),0 0 22px rgba(var(--goldrgb),.35)}
.node .nm{font-family:'Gowun Batang',serif;font-size:14px;color:var(--text);background:rgba(11,16,51,.6);border-radius:999px;padding:2px 10px;white-space:nowrap}
.node .st{font-size:12px;color:var(--gold)}
.node.lock{cursor:default}
.node.lock .dot{background:#3b3a6a;color:var(--soft);box-shadow:none}
.node.lock .nm{color:var(--soft)}
.node.now .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(var(--goldrgb),.12),0 0 30px rgba(var(--goldrgb),.55)}}
.wtabs{display:flex;gap:8px;margin-bottom:6px;position:relative}
.wtab{font-family:'Gowun Batang',serif;font-size:14px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.wtab.on{border-color:var(--gold);color:var(--gold);background:rgba(var(--goldrgb),.12)}
.wtab.lock{opacity:.55}
.wtabs.msg::after{content:attr(data-msg);position:absolute;left:0;top:38px;z-index:5;font-size:13px;color:var(--gold);background:rgba(11,16,51,.92);border:1px solid rgba(var(--goldrgb),.5);border-radius:999px;padding:4px 12px;white-space:nowrap}
.map.w2{background:radial-gradient(120% 80% at 50% 110%,#1d4a5a 0%,#2b1a5e 55%,#120a33 100%)}
.sec{font-family:'Gowun Batang',serif;color:var(--gold);font-size:17px;margin:4px 0 8px}
.friends{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fchip{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px 4px 6px;cursor:pointer;font-size:12px;color:var(--soft)}
.fchip canvas{width:52px;height:52px}
.fchip b{font-weight:400;font-size:13px;color:var(--text)}
.fchip.on{border-color:var(--gold);background:rgba(var(--goldrgb),.12)}
.fchip.off{opacity:.5}
.shopbtn{margin-top:12px;width:100%}
/* 상점 */
.shop{display:grid;gap:10px}
.scard{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px}
.scard canvas{width:72px;height:72px;flex:none;border-radius:14px;background:linear-gradient(160deg,#2b2f7a,#151a4a)}
.scard .si{flex:1;min-width:0}
.scard h2{font-family:'Gowun Batang',serif;font-size:17px;color:var(--gold);font-weight:400}
.scard p{font-size:13px;color:var(--soft);line-height:1.5;margin-top:2px}
.scard .sb{flex:none}
/* 게임 */
.stage{position:relative;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;background:#0b1033}
canvas#cv{display:block;width:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;pointer-events:none;font-family:'Gowun Batang',serif}
.hud .hearts{font-size:18px;letter-spacing:1px}
.hud .score{text-align:right;font-size:17px;color:var(--gold);line-height:1.25}
.hud .score small{display:block;font-size:12px;color:var(--soft)}
.pow{display:none;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--text);background:rgba(11,16,51,.55);border-radius:999px;padding:2px 8px 2px 6px}
.pow.on{display:inline-flex}
.pow i{display:block;width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.pow i u{display:block;height:100%;background:var(--gold)}
.hudbtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.hudbtns .iconbtn{background:rgba(11,16,51,.55);pointer-events:auto;width:34px;height:34px;font-size:15px}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(6,8,30,.62)}
.overlay.on{display:flex}
.overlay.full{position:fixed;z-index:30;background:rgba(6,8,30,.78);padding:20px 16px}
.overlay.full .obox{max-width:420px;max-height:calc(100vh - 40px)}
.obox{width:100%;max-width:360px;background:linear-gradient(160deg,#252a6e,#141842);border:1px solid var(--line);border-radius:20px;padding:16px;max-height:100%;overflow:auto}
.obox h3{font-family:'Gowun Batang',serif;color:var(--gold);font-size:20px;margin-bottom:8px}
.obox p{font-size:14px;line-height:1.65;color:var(--text)}
.obox .how{margin:8px 0 2px;padding-left:0;list-style:none;font-size:14px;color:var(--soft);line-height:1.7}
.obox .how li::before{content:'✦ ';color:var(--gold)}
.big{display:flex;gap:18px;margin:6px 0 8px;font-family:'Gowun Batang',serif}
.big div{font-size:13px;color:var(--soft)}
.big b{display:block;font-size:22px;color:var(--gold);font-weight:400}
.newrec{display:inline-block;font-size:12px;color:#1b1f5e;background:var(--gold);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:4px}
.prog{margin:6px 0 4px;font-size:13px;color:var(--soft)}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd86b,#ffb36b);border-radius:999px}
.found{margin-top:10px;display:grid;gap:10px}
.fb{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px}
.fb .fc{width:46px;height:66px;flex:none;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#5b3fa8,#2b1d63);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}
.fb .fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb .ft{flex:1;min-width:0}
.fb .ft b{display:block;font-family:'Gowun Batang',serif;font-weight:400;font-size:15px;line-height:1.35}
.fb .ft span{font-size:12px;color:var(--soft)}
.fb .fa{display:flex;flex-direction:column;gap:6px}
.sbtn{font-size:13px;padding:6px 10px;border-radius:999px;border:1.5px solid rgba(var(--goldrgb),.6);background:transparent;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text);text-align:center}
.sbtn.on{background:rgba(255,120,160,.2);border-color:#ff8fb1;color:#ffc1d4}
.sbtn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;font-family:'Gowun Batang',serif;font-size:17px;padding:12px 10px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(135deg,#ffd86b,#ffb36b);color:#2a1d4a}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);background:rgba(11,16,51,.85);border:1px solid rgba(var(--goldrgb),.6);color:var(--gold);font-family:'Gowun Batang',serif;font-size:15px;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.hint{color:var(--soft);font-size:12px;text-align:center;margin-top:8px;line-height:1.5}
/* 조작 버튼 */
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad .lr{display:flex;gap:10px}
.pbtn{width:74px;height:74px;border-radius:50%;border:2px solid rgba(var(--goldrgb),.45);background:rgba(255,255,255,.07);font-size:26px;color:var(--text);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none;cursor:pointer}
.pbtn.jump{width:92px;height:92px;font-family:'Gowun Batang',serif;font-size:17px;background:radial-gradient(circle at 35% 30%,rgba(255,243,196,.35),rgba(var(--goldrgb),.18));border-color:var(--gold);color:var(--gold)}
.pbtn.down{background:rgba(var(--goldrgb),.28);transform:scale(.95)}
</style>
</head>
<body>
<div class="wrap">

  <!-- 놀이터 -->
  <section class="screen on" id="s-hub">
    <div class="top">
      <a class="back" href="nightbooks.html" id="tBack">← 책방으로</a>
      <button class="iconbtn" id="sndHub" aria-label="소리"></button>
    </div>
    <h1 id="tHub">🎮 밤하늘 놀이터</h1>
    <p class="lead" id="tLead">책방 친구들과 신나게 놀다 보면, 숨어 있던 책을 만날지도 몰라요!</p>
    <div class="games">
      <button class="gcard" onclick="openMap()">
        <div class="gart" id="artAdv"></div>
        <div><h2 id="tAdvName">별빛 책장 모험</h2><p id="tAdvDesc">토리와 친구들이 밤하늘 책장 세계를 모험해요. 잉크 괴물을 밟고, 투명 배관을 타고, 깃발까지!</p><div class="best" id="advBest"></div></div>
      </button>
      <div class="gcard soon">
        <div class="gart" id="artIsle"></div>
        <div><h2><span id="tIsleName">둥실둥실 책 섬 탐험</span><span class="tag" id="tSoon">곧 열려요</span></h2><p id="tIsleDesc">비스듬히 내려다보는 책 섬을 돌아다니며 숨은 별을 찾아요.</p></div>
      </div>
    </div>
  </section>

  <!-- 지도 -->
  <section class="screen" id="s-map">
    <div class="top">
      <button class="back" onclick="go('s-hub');drawHub()" id="tBackHub">← 놀이터로</button>
      <span class="wallet" id="walletMap">★ 0</span>
    </div>
    <div class="wtabs" id="wtabs"></div>
    <h1 id="tWorld">월드 1 · 밤하늘 책장</h1>
    <div class="map" id="map"></div>
    <div class="sec" id="tWith">함께 갈 친구</div>
    <div class="friends" id="friendRow"></div>
    <button class="btn ghost shopbtn" onclick="openShop()" id="tShopBtn">⭐ 별 상점</button>
  </section>

  <!-- 상점 -->
  <section class="screen" id="s-shop">
    <div class="top">
      <button class="back" onclick="openMap()" id="tBackMap">← 지도로</button>
      <span class="wallet" id="walletShop">★ 0</span>
    </div>
    <h1 id="tShop">⭐ 별 상점</h1>
    <p class="lead" id="tShopLead">모은 별로 새 친구를 데려올 수 있어요. 친구마다 특별한 힘이 있어요!</p>
    <div class="shop" id="shopList"></div>
  </section>

  <!-- 게임 -->
  <section class="screen" id="s-game">
    <div class="top">
      <button class="back" onclick="leaveGame()" id="tBackMap2">← 지도로</button>
      <span id="stageLbl" style="font-family:'Gowun Batang',serif;color:var(--soft);font-size:14px"></span>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud"><div><div class="hearts" id="hearts"></div><div class="pow" id="pow"><span id="powI"></span><i><u id="powB"></u></i></div></div><div class="score"><span id="sc">★ 0</span></div></div>
      <div class="hudbtns"><button class="iconbtn" id="sndBtn" aria-label="소리"></button><button class="iconbtn" id="pauseBtn" aria-label="잠깐 멈춤">⏸</button></div>
      <div class="toast" id="toast"></div>
      <div class="overlay" id="ovStart"><div class="obox" id="startBox"></div></div>
      <div class="overlay" id="ovPause"><div class="obox">
        <h3 id="tPauseT">잠깐 쉬어 가요</h3>
        <div class="row"><button class="btn ghost" onclick="leaveGame()" id="tQuit">지도로</button><button class="btn" onclick="resume()" id="tResume">계속하기</button></div>
        <div class="row" style="margin-top:8px"><button class="btn ghost" onclick="restartStage()" id="tRetry">처음부터</button></div>
      </div></div>
      <div class="overlay full" id="ovEnd"><div class="obox" id="endBox"></div></div>
    </div>
    <div class="pad" id="pad">
      <div class="lr"><button class="pbtn" id="bL" aria-label="왼쪽">◀</button><button class="pbtn" id="bR" aria-label="오른쪽">▶</button></div>
      <button class="pbtn jump" id="bJ" aria-label="점프"><span id="tJumpBtn">점프</span></button>
    </div>
    <p class="hint" id="tHint">컴퓨터에서는 ← → 키로 움직이고, 스페이스바나 ↑ 키로 점프해요.</p>
  </section>
</div>

<script>

let soundOn=LS.get('starPlaySound',true), actx=null;
function sndIcon(){const i=soundOn?'🔊':'🔇';['sndHub','sndBtn'].forEach(id=>{const b=document.getElementById(id);b.textContent=i;b.setAttribute('aria-label',T('sound')+(soundOn?' ON':' OFF'))})}
function toggleSound(){soundOn=!soundOn;LS.set('starPlaySound',soundOn);sndIcon();if(soundOn)beep('star')}
document.getElementById('sndHub').onclick=toggleSound;document.getElementById('sndBtn').onclick=e=>{e.stopPropagation();toggleSound()};
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(f1,f2,dur,type,vol,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.07,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02)}
let lastStarBeep=0;
function beep(k,n){if(!soundOn)return;
  if(k==='jump')tone(380,620,0.12,'triangle',0.06);
  else if(k==='jump2')tone(520,900,0.12,'triangle',0.06);
  else if(k==='star'){const now=performance.now();if(now-lastStarBeep<40)return;lastStarBeep=now;tone(1320,1760,0.09,'sine',0.05)}
  else if(k==='stomp'){const f=440*Math.pow(1.12,Math.min(n||0,8));tone(f,f*1.6,0.12,'square',0.04)}
  else if(k==='bonk')tone(180,120,0.08,'square',0.05);
  else if(k==='block')tone(880,1320,0.1,'triangle',0.05);
  else if(k==='power'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0,0.1,'triangle',0.05,i*0.06))}
  else if(k==='spring')tone(300,900,0.18,'sine',0.07);
  else if(k==='pipe'){tone(600,300,0.25,'sine',0.05)}
  else if(k==='smash')tone(160,60,0.18,'sawtooth',0.05);
  else if(k==='heart'){tone(660,0,0.12,'sine',0.06);tone(880,0,0.16,'sine',0.06,0.1)}
  else if(k==='check'){tone(784,0,0.1,'sine',0.05);tone(1047,0,0.14,'sine',0.05,0.09)}
  else if(k==='hit')tone(220,90,0.25,'sawtooth',0.05);
  else if(k==='book'){[784,988,1175,1568].forEach((f,i)=>tone(f,0,0.14,'sine',0.06,i*0.09))}
  else if(k==='clear'){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,0,0.16,'triangle',0.05,i*0.1))}
  else if(k==='over'){[523,440,349].forEach((f,i)=>tone(f,0,0.18,'triangle',0.05,i*0.14))}
  else if(k==='switch'){tone(520,0,0.08,'square',0.05);tone(780,0,0.12,'square',0.05,0.08)}
  else if(k==='cannon'){tone(140,50,0.3,'sawtooth',0.07);tone(900,1500,0.2,'triangle',0.04,0.05)}
  else if(k==='swim')tone(500,760,0.1,'sine',0.04);
  else if(k==='buy'){[659,880,1175].forEach((f,i)=>tone(f,0,0.12,'sine',0.06,i*0.08))}
}

// ── 책 데이터: 책방 앱 파일에서 읽어 와요 (보너스 책용) ──
let BOOKS=null;
async function loadBooks(){
  try{
    const r=await fetch('nightbooks.html',{cache:'no-cache'}); const s=await r.text();
    const grab=(name,endTok)=>{const a=s.indexOf('const '+name+' = ');if(a<0)return null;const st=a+('const '+name+' = ').length;const e=s.indexOf(endTok,st);return s.slice(st,e+endTok.length-1)};
    const raw=Function('return '+grab('RAW','\n];'))();
    const en=Function('return '+(()=>{const a=s.indexOf('const EN_BOOKS = ');const e=s.indexOf('\n',a);return s.slice(a+17,e).replace(/;\s*$/,'')})())();
    const cov=Function('return '+(()=>{const a=s.indexOf('const COVERS = ');const e=s.indexOf('\n',a);return s.slice(a+15,e).replace(/;\s*$/,'')})())();
    BOOKS=raw.map((r,i)=>({id:i,tk:r[0],ak:r[1],e:r[6],te:(en[i]||[])[0]||r[0],ae:(en[i]||[])[1]||r[1],cov:cov[i]||null}));
  }catch(e){BOOKS=null}
}

// ════════════════ 그림 (책방 그림체) ════════════════
const SPINE=['#5b3fa8','#3f9a6b','#b5562f','#2f5fa8','#f0a93b','#6a5a8e','#1f6f8b','#9a6a3a','#7d9a3a','#3d7a8a'];
function starP(c,x,y,r,fill,rot){c.save();c.translate(x,y);if(rot)c.rotate(rot);c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath();c.fillStyle=fill;c.fill();c.restore()}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function dots(c,x1,x2,y,r){c.fillStyle='#2a1d4a';c.beginPath();c.arc(x1,y,r,0,7);c.arc(x2,y,r,0,7);c.fill()}
function blush(c,x,y,r){c.fillStyle='rgba(255,160,190,.8)';c.beginPath();c.arc(x,y,r,0,7);c.fill()}

// 친구 그리기 — (x,y)는 발 가운데
function drawChar(c,id,o){
  c.save();c.translate(o.x,o.y);
  const sc=o.sc||1;let sy=1,sx=1;if(o.squash>0){sy=1-o.squash*1.6;sx=1+o.squash*1.2}
  c.scale((o.face||1)*sc*sx,sc*sy*(o.flip?-1:1));
  const t=o.t||0,run=o.run,air=!o.ground;
  if(o.cape){ // 별 망토
    const fl=Math.sin(t*14)*3+(run?4:0);
    c.fillStyle='#232a7a';c.beginPath();c.moveTo(-2,-26);c.quadraticCurveTo(-16-fl,-14,-20-fl,2);c.lineTo(-4,0);c.closePath();c.fill();
    starP(c,-12-fl*.5,-8,2.6,'#ffd86b');starP(c,-16-fl*.8,-1,2,'#ffd86b');
  }
  if(id==='tori'){
    c.scale(.82,.82);c.translate(0,-24);
    const earTilt=o.ground?Math.sin(t*16)*0.12*(run?1:.3):(o.vy<0?0.55:0.25);
    for(const [ex,base] of [[2,-0.18],[9,0.22]]){c.save();c.translate(ex,-4);c.rotate(base-earTilt);
      c.fillStyle='#fff';c.beginPath();c.ellipse(0,-11,3.6,11,0,0,7);c.fill();
      c.fillStyle='#ffc1d4';c.beginPath();c.ellipse(0,-11,1.7,7.5,0,0,7);c.fill();c.restore()}
    c.fillStyle='#fff';c.beginPath();c.ellipse(-2,12,13,10,0,0,7);c.fill();c.beginPath();c.arc(-14,11,4.5,0,7);c.fill();
    c.fillStyle='#f1ecff';const lg=run?Math.sin(t*16)*4:(air?3:1);
    c.beginPath();c.ellipse(-7+lg,21,4.5,3,0,0,7);c.fill();c.beginPath();c.ellipse(4-lg,21,4.5,3,0,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(7,2,9.5,0,7);c.fill();
    if(o.hurt){c.fillStyle='#2a1d4a';c.fillRect(4,0.5,2.6,1.2);c.fillRect(9.4,0.5,2.6,1.2)}else dots(c,5.2,10.6,1.5,1.25);
    blush(c,13,5.5,1.9);
  }else if(id==='sparkle'){
    const b=run?Math.abs(Math.sin(t*14))*2:0;
    const lg=run?Math.sin(t*14)*3:0;
    c.fillStyle='#e8a948';c.beginPath();c.ellipse(-5+lg,-2,4,2.6,0,0,7);c.ellipse(5-lg,-2,4,2.6,0,0,7);c.fill();
    c.fillStyle='rgba(255,216,107,.22)';c.beginPath();c.arc(0,-16-b,19,0,7);c.fill();
    starP(c,0,-16-b,16,'#ffd86b',Math.sin(t*3)*0.06+(air?Math.min(.3,Math.max(-.3,(o.vy||0)/2000)):0));
    if(o.hurt){c.fillStyle='#2a1d4a';c.fillRect(-1,-17-b,3,1.3);c.fillRect(5,-17-b,3,1.3)}else dots(c,0.5,6.5,-16-b,1.3);
    blush(c,9,-12-b,1.8);blush(c,-3,-12-b,1.6);
    const tw=0.6+0.4*Math.sin(t*6);c.globalAlpha=tw;starP(c,-14,-34-b,3.4,'#fff6c9');c.globalAlpha=1;
  }else if(id==='fifi'){
    const hov=o.ground?Math.sin(t*5)*1.2:0;c.translate(0,hov);
    const fl=Math.sin(t*(o.glide?26:12))*0.35;
    c.fillStyle='rgba(230,220,255,.8)';
    c.save();c.translate(-6,-20);c.rotate(-0.5+fl);c.beginPath();c.ellipse(-5,0,8,4.5,0,0,7);c.fill();c.restore();
    c.save();c.translate(-3,-21);c.rotate(-1.1-fl);c.beginPath();c.ellipse(-5,0,7,4,0,0,7);c.fill();c.restore();
    c.fillStyle='#a58cf0';c.beginPath();c.moveTo(0,-31);c.quadraticCurveTo(12,-17,12,-10);c.arc(0,-10,12,0,Math.PI);c.quadraticCurveTo(-12,-17,0,-31);c.fill();

function B(w,h){const g=[];for(let y=0;y<h;y++)g.push(Array(w).fill(' '));const o={g,w,h,movers:[],pipes:[],zones:[],cannons:[],
  set(x,y,c){if(x>=0&&x<w&&y>=0&&y<h)g[y][x]=c;return o},
  fill(x0,x1,y0,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)o.set(x,y,c);return o},
  ground(x0,x1,top){return o.fill(x0,x1,top,h-1,'#')},
  row(x,y,s){[...s].forEach((c,i)=>{if(c!=='.')o.set(x+i,y,c)});return o},
  stars(x0,x1,y){for(let x=x0;x<=x1;x++)o.set(x,y,'*');return o},
  col(x,y0,y1,c){return o.fill(x,x,y0,y1,c||'*')},
  mover(x,y,axis,range){o.movers.push({x,y,axis,range});return o},
  ice(x0,x1,top){o.fill(x0,x1,top,h-1,'#');return o.fill(x0,x1,top,top,'I')},
  zone(x0,y0,x1,y1,k,v){o.zones.push({x:x0*TS,y:y0*TS,w:(x1-x0+1)*TS,h:(y1-y0+1)*TS,k,v:v||0});return o},
  cannon(x,y,ang,spd){o.cannons.push({x:x*TS+16,y:y*TS+16,ang,spd,cool:0,kick:0});return o},
  pipe(pts){o.pipes.push(pts);return o}};return o}

    else if(c==='p'){g.enemies.push({k:'plane',ox:cx,oy:cy,x:cx-14,y:cy-6,w:28,h:12,alive:true,t:Math.random()*6,dir:-1});b.g[y][x]=' '}
    else if(c==='k'){g.checks.push({x:cx,y:(y+1)*TS,on:false});b.g[y][x]=' '}
    else if(c==='E'){g.goal={x:cx,y:(y+1)*TS};b.g[y][x]=' '}
  }
  for(const m of b.movers)g.movers.push({ax:m.axis,x0:m.x*TS,y0:m.y*TS,range:m.range*TS,x:m.x*TS,y:m.y*TS,w:3*TS,h:12,dx:0,dy:0,ph:g.movers.length*2.1});
  for(const pts of b.pipes){const P=pts.map(([x,y])=>({x:x*TS+16,y:y*TS+16}));let len=0;const seg=[];for(let i=1;i<P.length;i++){const l=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);seg.push(l);len+=l}
    g.pipes.push({P,seg,len,arm:[true,true]})}

  g.p=newPlayer(g.spawn.x,g.spawn.y);
  for(let i=0;i<60;i++)g.bg.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+0.3,ph:Math.random()*6});

}
function newPlayer(fx,fy){return {x:fx-10,y:fy-26,w:20,h:26,vx:0,vy:0,face:1,ground:false,jumps:0,coyote:0,buffer:0,hold:1,wall:0,wallT:0,wallDir:0,lock:0,inv:0,
  pow:null,powT:0,powMax:1,squash:0,on:null,pipe:null,pendGrow:false,prevB:fy,flip:false,water:false,launch:0,cannon:null}}

// ── 타일 ──
function tile(g,tx,ty){if(tx<0||tx>=g.w)return '#';if(ty<0||ty>=g.h)return ' ';return g.grid[ty][tx]}
function solidT(g,tx,ty){const c=tile(g,tx,ty);if(c==='c')return false;
  if(c==='r'||c==='b'){if(g.ghost.has(tx+','+ty))return false;return c==='r'?g.sw===0:g.sw===1}
  return SOLID.has(c)}
function zonesAt(g,x,y){const z={};for(const q of g.zones){if(x>=q.x&&x<q.x+q.w&&y>=q.y&&y<q.y+q.h){
  if(q.k==='wind')z.wind=(z.wind||0)+q.v;else{z[q.k]=true;if(q.k==='water')z.surf=q.y}}}return z}
function cloudOn(g,tx,ty){const s=g.crumble[tx+','+ty];return !(s&&s.gone)}
function overlapsSolid(g,x,y,w,h){const x0=Math.floor(x/TS),x1=Math.floor((x+w-0.01)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-0.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidT(g,tx,ty))return true;return false}

const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j',KeyZ:'j'};

const rnd=(a,b)=>a+Math.random()*(b-a);
function burst(g,x,y,n,col,sp){for(let i=0;i<n;i++)g.parts.push({x,y,vx:rnd(-1,1)*(sp||90),vy:rnd(-1.2,0.3)*(sp||90),life:rnd(.3,.6),c:col,r:rnd(1.4,2.6)})}
function floatText(g,x,y,s){g.texts.push({x,y,s,t:0.9})}
function addStar(g,n,x,y){
  const before=Math.floor((g.startTotal+g.stars)/100);g.stars+=n;const after=Math.floor((g.startTotal+g.stars)/100);
  if(after>before)for(let i=before;i<after;i++)findBook(g);
  if(n>1&&x!=null)floatText(g,x,y,'+'+n);
}
function findBook(g){
  if(!BOOKS)return;
  const likes=new Set(LS.get('starLikes',[])),readM=LS.get('starRead',{}),nope=new Set(LS.get('starNope',[]));
  const seen=new Set([...play.found,...g.foundNow]);
  let pool=BOOKS.filter(b=>!likes.has(b.id)&&!readM[b.id]&&!nope.has(b.id)&&!seen.has(b.id));
  if(!pool.length)pool=BOOKS.filter(b=>!seen.has(b.id));if(!pool.length)return;
  const b=pool[Math.floor(Math.random()*pool.length)];g.foundNow.push(b.id);beep('book');toast(T('toastBook'));
}
function safe(p){return p.pow==='cape'||p.pow==='giant'}
function hurt(g,fall){
  const p=g.p;
  if(!fall&&(p.inv>0||safe(p)))return;
  g.hearts--;beep('hit');g.shake=0.25;if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  if(g.hearts<=0){g.hearts=0;failStage();return}

  else{p.vy=-320;p.vx=-p.face*160;p.lock=0.2;p.ground=false}
}
function respawn(g){const p=g.p;const np=newPlayer(g.check.x,g.check.y);np.inv=1.6;np.face=1;g.p=np;g.combo=0;camSnap(g)}
function jump(p,n,g){p.vy=(n===1?-560:-520)*(p.flip?-1:1);p.ground=false;p.coyote=0;p.jumps=n;p.hold=0;p.squash=0.1;p.on=null;beep(n===1?'jump':'jump2');
  burst(g,p.x+p.w/2,p.y+p.h,5,n===1?'#ffe9a8':'#c9b8ff',60)}
function setGiant(g,on){const p=g.p;const b=p.y+p.h,cx=p.x+p.w/2;
  if(on){const nw=30,nh=40;if(overlapsSolid(g,cx-nw/2,b-nh,nw,nh)){p.pendGrow=true;return}p.w=nw;p.h=nh;p.x=cx-nw/2;p.y=b-nh;p.pendGrow=false}
  else{p.w=20;p.h=26;p.x=cx-10;p.y=b-26;p.pendGrow=false}}
function givePow(g,k){const p=g.p;
  if(k==='heart'){g.hearts=Math.min(3,g.hearts+1);beep('heart');toast(T('toastHeart'));return}
  if(p.pow==='giant'&&k!=='giant')setGiant(g,false);
  p.pow=k;p.powMax=p.powT={cape:9,mag:15,giant:10,fly:8}[k];beep('power');toast(T('toast_'+k));
  if(k==='giant')setGiant(g,true);
  if(k==='fly'){p.vy=Math.min(p.vy,-200);p.ground=false}
}
function hitBlock(g,tx,ty){
  const c=tile(g,tx,ty),p=g.p;g.bump[tx+','+ty]=0.15;
  if(c==='O'){g.sw^=1;beep('switch');g.shake=0.12;
    const x0=Math.floor(p.x/TS),x1=Math.floor((p.x+p.w-0.01)/TS),y0=Math.floor(p.y/TS),y1=Math.floor((p.y+p.h-0.01)/TS);
    for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){const cc=tile(g,xx,yy);if(cc==='r'||cc==='b')g.ghost.add(xx+','+yy)}return}
  if(c==='?'){g.grid[ty][tx]='u';addStar(g,1);beep('block');g.items.push({k:'pop',x:tx*TS+16,y:ty*TS,vy:-260,t:0.45});
    for(const e of g.enemies)if(e.alive&&e.k==='ink'&&Math.abs(e.x+12-(tx*TS+16))<24&&Math.abs(e.y+e.h-ty*TS)<4)kill(g,e,true)}
  else if(BLOCK_POW[c]){g.grid[ty][tx]='u';beep('block');g.items.push({k:BLOCK_POW[c],x:tx*TS+16,y:ty*TS+16,rise:TS,bx:tx,by:ty})}
  else if(c==='B'&&p.pow==='giant'){smash(g,tx,ty)}

function smash(g,tx,ty){g.grid[ty][tx]=' ';beep('smash');addStar(g,1);
  for(let i=0;i<6;i++)g.parts.push({x:tx*TS+16,y:ty*TS+16,vx:rnd(-160,160),vy:rnd(-300,-80),life:0.7,c:SPINE[(tx+i)%10],r:4,sq:1})}
function kill(g,e,quiet){e.alive=false;e.dead=0.4;if(!quiet)beep('stomp',g.combo);burst(g,e.x+e.w/2,e.y+e.h/2,10,'#5a4fb0',120)}

function update(dt){
  const g=G,p=g.p;g.t+=dt;
  // 움직이는 발판
  for(const m of g.movers){m.ph+=dt;const w=2.2/Math.max(1,m.range/TS);const ox=m.x,oy=m.y;
    if(m.ax==='h')m.x=m.x0+Math.sin(m.ph*w)*m.range;else m.y=m.y0+Math.sin(m.ph*w)*m.range;m.dx=m.x-ox;m.dy=m.y-oy}
  // 사라지는 구름
  for(const k in g.crumble){const s=g.crumble[k];s.t-=dt;if(s.t<=0){if(!s.gone){s.gone=true;s.t=3;const [tx,ty]=k.split(',').map(Number);burst(g,tx*TS+16,ty*TS+8,8,'#e9e4ff',70)}else delete g.crumble[k]}}
  for(const k in g.tramp){g.tramp[k]-=dt;if(g.tramp[k]<=0)delete g.tramp[k]}
  for(const k in g.bump){g.bump[k]-=dt;if(g.bump[k]<=0)delete g.bump[k]}
  if(!p.pipe)for(const pp of g.pipes){const cx=p.x+p.w/2,cy=p.y+p.h/2;[0,1].forEach(i=>{const E=i?pp.P[pp.P.length-1]:pp.P[0];if(!pp.arm[i]&&Math.hypot(cx-E.x,cy-E.y)>44)pp.arm[i]=true})}

  if(g.done){g.endT-=dt;p.vx*=0.9;if(g.cleared){if(Math.random()<0.4)burst(g,g.goal.x+rnd(-30,30),g.goal.y-80+rnd(-30,30),3,'#ffd86b',80)}
    stepParts(g,dt);if(g.endT<=0){g.running=false;g.cleared?showClear():showFail()}return}

  if(p.pipe){pipeStep(g,dt);stepWorld(g,dt);collect(g);camera(g,dt);hud();return}

  // 파워 시간
  if(p.pow){p.powT-=dt;if(p.powT<=0){if(p.pow==='giant')setGiant(g,false);if(p.pow==='fly')p.jumps=1;p.pow=null}}
  if(p.pendGrow&&p.pow==='giant')setGiant(g,true);
  // 구역
  const Z=zonesAt(g,p.x+p.w/2,p.y+p.h/2);
  const wasFlip=p.flip;p.flip=!!Z.flip&&p.pow!=='fly';
  if(p.flip!==wasFlip){p.ground=false;p.on=null;p.coyote=0;p.jumps=1;p.hold=1;burst(g,p.x+p.w/2,p.y+p.h/2,8,'#ffb3d9',70)}
  const gs=p.flip?-1:1;
  const wasWater=p.water;p.water=!!Z.water&&p.pow!=='fly';
  if(p.water!==wasWater){burst(g,p.x+p.w/2,p.y+p.h/2,10,'#bfe6ff',90);if(p.water){p.vy*=0.35;p.jumps=0}else if(p.vy<0)p.jumps=1}
  // 대포 책
  for(const cn of g.cannons){if(cn.cool>0)cn.cool-=dt;if(cn.kick>0)cn.kick-=dt}
  if(p.cannon){const cn=p.cannon;cn.t-=dt;p.x=cn.c.x-p.w/2;p.y=cn.c.y-p.h/2;p.vx=p.vy=0;
    if(cn.t<=0){const an=cn.c.ang*Math.PI/180;p.vx=Math.cos(an)*cn.c.spd;p.vy=Math.sin(an)*cn.c.spd;p.launch=0.8;p.cannon=null;cn.c.cool=0.9;cn.c.kick=0.3;
      p.x+=Math.cos(an)*18;p.y+=Math.sin(an)*18;p.jumps=1;p.hold=1;p.ground=false;beep('cannon');g.shake=0.15;burst(g,cn.c.x+Math.cos(an)*26,cn.c.y+Math.sin(an)*26,16,'#ffd86b',150)}
    stepWorld(g,dt);camera(g,dt);hud();return}
  if(p.launch<=0)for(const cn of g.cannons){if(cn.cool<=0&&Math.abs(p.x+p.w/2-cn.x)<18&&Math.abs(p.y+p.h/2-cn.y)<20){p.cannon={c:cn,t:0.4};beep('pipe');stepWorld(g,dt);camera(g,dt);hud();return}}
  if(p.launch>0){p.launch-=dt;if(p.ground)p.launch=0}
  // 좌우
  const dir=(keys.r?1:0)-(keys.l?1:0);
  if(p.lock>0)p.lock-=dt;
  const ice=p.ground&&tile(g,Math.floor((p.x+p.w/2)/TS),Math.floor((p.flip?p.y-2:p.y+p.h+2)/TS))==='I';
  const maxV=p.water?135:(p.pow==='giant'?175:195);
  if(p.launch>0){}
  else if(dir&&p.lock<=0){const acc=p.ground?(ice?520:(p.vx*dir<0?3200:1800)):1150;if(p.vx*dir<maxV)p.vx=Math.max(-maxV,Math.min(maxV,p.vx+dir*acc*dt));p.face=dir}
  else if(p.lock<=0){const f=p.ground?(ice?230:1900):(p.water?320:280);if(Math.abs(p.vx)<=f*dt)p.vx=0;else p.vx-=Math.sign(p.vx)*f*dt}
  if(p.water&&Math.abs(p.vx)>maxV)p.vx=Math.sign(p.vx)*Math.max(maxV,Math.abs(p.vx)-600*dt);
  // 점프
  if(jumpEdge){p.buffer=0.13;jumpEdge=false}
  const fr=g.fr,maxJ=fr.jumps;
  if(p.buffer>0){
    if(p.pow==='fly'){p.buffer=0}
    else if(p.water){p.buffer=0;p.ground=false;p.on=null;
      if(Z.surf!=null&&p.y<Z.surf+10){p.vy=-600;beep('jump')}else{p.vy=-280;beep('swim')}
      for(let i=0;i<3;i++)g.parts.push({x:p.x+p.w/2+rnd(-6,6),y:p.y+p.h,vx:rnd(-10,10),vy:rnd(-60,-20),life:0.6,c:'#cfefff',r:2,bub:1})}
    else if(p.ground||p.coyote>0){jump(p,1,g);p.buffer=0}
    else if(p.wallT>0&&p.launch<=0){p.vy=-540*gs;p.vx=-p.wallDir*235;p.face=-p.wallDir;p.lock=0.16;p.jumps=1;p.hold=0;p.wallT=0;p.buffer=0;beep('jump');
      burst(g,p.wallDir>0?p.x+p.w:p.x,p.y+p.h/2,6,'#ffe9a8',60)}
    else if(p.jumps<maxJ){jump(p,Math.max(p.jumps,1)+1,g);p.buffer=0}
    else p.buffer-=dt;
  }
  // 중력
  if(p.pow==='fly'){
    if(keys.j)p.vy-=1700*dt;else p.vy+=700*dt;p.vy=Math.max(-260,Math.min(190,p.vy));
    if(Math.random()<0.4)burst(g,p.x+p.w/2,p.y+p.h+6,1,'#fff',30);
  }else if(p.water){
    p.vy+=480*dt;p.vy=Math.max(-600,Math.min(140,p.vy));
    if(Math.random()<0.04)g.parts.push({x:p.x+p.w/2+p.face*8,y:p.y+4,vx:0,vy:-40,life:0.8,c:'#cfefff',r:1.8,bub:1});
  }else{
    let grav=2000*(Z.low?0.4:1)*(p.launch>0?0.55:1);const cap=Z.low?380:900;
    if(keys.j&&p.vy*gs<0&&p.hold<0.22){grav*=0.45;p.hold+=dt}
    if(!keys.j)p.hold=1;
    p.vy+=grav*dt*gs;
    if(Z.up&&!p.flip){p.vy-=2650*dt;if(p.vy<-330)p.vy=-330}
    if(fr.glide&&keys.j&&p.vy*gs>75)p.vy=75*gs;
    if(p.wall&&!p.ground&&p.vy*gs>110&&dir===p.wall)p.vy=110*gs;
    if(gs>0)p.vy=Math.min(p.vy,cap);else p.vy=Math.max(p.vy,-cap);
  }
  // 발판에 탄 채로 함께 움직이기
  if(p.on){p.x+=p.on.dx;p.y+=p.on.dy}
  // X 이동 (바람·물살 포함)
  moveX(g,p,(p.vx+(Z.wind||0))*dt);
  // Y 이동
  p.prevB=p.y+p.h;const wasGround=p.ground;p.ground=false;p.on=null;
  p.y+=p.vy*dt;if(p.flip)moveYFlip(g,p);else moveY(g,p,wasGround);
  if(p.pow==='fly'&&p.y<40){p.y=40;if(p.vy<0)p.vy=0}
  if(p.ground){p.jumps=0;p.combo=0;g.combo=0;p.launch=0;if(!wasGround)p.squash=0.08;if(p.buffer>0&&p.pow!=='fly'&&!p.water){jump(p,1,g);p.buffer=0}}
  else if(wasGround&&p.vy*gs>=0){p.coyote=0.09;if(p.jumps===0)p.jumps=1}
  if(p.coyote>0)p.coyote-=dt;
  // 스위치로 생긴 블록과 겹친 칸은 비켜날 때까지 통과
  for(const k of [...g.ghost]){const [tx,ty]=k.split(',').map(Number);if(!(p.x+p.w>tx*TS&&p.x<tx*TS+TS&&p.y+p.h>ty*TS&&p.y<ty*TS+TS))g.ghost.delete(k)}
  // 벽 닿음
  p.wall=0;
  if(!p.ground){const probe=d=>{const x=d>0?p.x+p.w+1:p.x-1;const tx=Math.floor(x/TS);const ty0=Math.floor((p.y+4)/TS),ty1=Math.floor((p.y+p.h-4)/TS);for(let ty=ty0;ty<=ty1;ty++)if(solidT(g,tx,ty))return true;return false};
    if(probe(1)&&(dir>0||p.vx>0||p.face>0))p.wall=1;else if(probe(-1)&&(dir<0||p.vx<0||p.face<0))p.wall=-1;
    if(p.wall){p.wallT=0.12;p.wallDir=p.wall;if(p.vy*gs>0&&dir===p.wall&&Math.random()<0.3)burst(g,p.wall>0?p.x+p.w:p.x,p.y+p.h,1,'#ffe9a8',20)}}
  if(p.wallT>0&&!p.wall)p.wallT-=dt;
  if(p.squash>0)p.squash-=dt;if(p.inv>0)p.inv-=dt;if(g.shake>0)g.shake-=dt;
  // 떨어짐
  if(p.y>g.LH+40||(p.flip&&p.y<-90)){hurt(g,true);return}
  // 펜촉
  {const x0=Math.floor(p.x/TS),x1=Math.floor((p.x+p.w-1)/TS),y0=Math.floor(p.y/TS),y1=Math.floor((p.y+p.h-1)/TS);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const c=tile(g,tx,ty);if(c==='^'){if(p.x+p.w>tx*TS+5&&p.x<tx*TS+27&&p.y+p.h>ty*TS+16)hurt(g,false)}else if(c==='V'){if(p.x+p.w>tx*TS+5&&p.x<tx*TS+27&&p.y<ty*TS+16)hurt(g,false)}}}
  // 배관 입구
  for(const pp of g.pipes){const cx=p.x+p.w/2,cy=p.y+p.h/2;for(let i=0;i<2;i++){const E=i?pp.P[pp.P.length-1]:pp.P[0];
    if(pp.arm[i]&&Math.abs(cx-E.x)<18&&Math.abs(cy-E.y)<22){p.pipe={pp,from:i,s:0};pp.arm[0]=pp.arm[1]=false;beep('pipe');p.vx=p.vy=0;break}}if(p.pipe)break}
  stepWorld(g,dt);
  collect(g);

  c.setTransform(DPR*SC,0,0,DPR*SC,(-g.cam.x*SC+sh)*DPR,(-g.cam.y*SC)*DPR);
  const x0=Math.max(0,Math.floor(g.cam.x/TS)-1),x1=Math.min(g.w-1,Math.ceil((g.cam.x+VW)/TS)+1),y0=Math.max(0,Math.floor(g.cam.y/TS)-1),y1=Math.min(g.h-1,Math.ceil((g.cam.y+VH)/TS)+1);
  for(const z of g.zones)drawZone(c,g,z,false);
  for(const pp of g.pipes)drawPipe(c,g,pp);
  drawFlag(c,g);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const ch=g.grid[ty][tx];if(ch!==' ')drawTile(g,c,ch,tx,ty)}
  for(const m of g.movers){c.fillStyle='#e0a840';rrect(c,m.x,m.y,m.w,12,4);c.fill();c.fillStyle='#c4483e';c.fillRect(m.x+m.w/2-5,m.y+12,10,10);c.beginPath();c.moveTo(m.x+m.w/2-5,m.y+22);c.lineTo(m.x+m.w/2,m.y+17);c.lineTo(m.x+m.w/2+5,m.y+22);c.fillStyle=THEME[g.st.theme].sky[1];c.fill();
    c.fillStyle='rgba(255,255,255,.45)';c.fillRect(m.x+5,m.y+3,m.w-10,1.5)}
  for(const it of g.items){if(it.got)continue;if(it.x<g.cam.x-30||it.x>g.cam.x+VW+30||it.y<g.cam.y-40||it.y>g.cam.y+VH+40)continue;
    if(it.rise>0){c.save();c.beginPath();c.rect(it.bx*TS-10,it.by*TS-60,TS+20,60);c.clip();drawItem(c,g,it);c.restore()}else drawItem(c,g,it)}
  for(const e of g.enemies)drawEnemy(c,g,e);
  drawPlayer(c,g);
  for(const cn of g.cannons)drawCannon(c,g,cn);
  for(const z of g.zones)if(z.k==='water')drawZone(c,g,z,true);
  for(const q of g.parts){c.globalAlpha=Math.max(0,Math.min(1,q.life*2.4));c.fillStyle=q.c;if(q.sq)c.fillRect(q.x-q.r,q.y-q.r*0.6,q.r*2,q.r*1.2);else{c.beginPath();c.arc(q.x,q.y,q.r,0,7);c.fill()}}
  c.globalAlpha=1;
  // 어두운 탑
  if(g.st.dark){
    const d=dctx;d.setTransform(1,0,0,1,0,0);d.globalCompositeOperation='source-over';d.clearRect(0,0,dark.width,dark.height);
    d.fillStyle='rgba(4,5,18,.9)';d.fillRect(0,0,dark.width,dark.height);
    const p=g.p,R=(g.fr.light?200:115)*SC*DPR,px=((p.x+p.w/2-g.cam.x)*SC)*DPR,py=((p.y+p.h/2-g.cam.y)*SC)*DPR;
    d.globalCompositeOperation='destination-out';const gr=d.createRadialGradient(px,py,R*0.25,px,py,R);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=gr;d.beginPath();d.arc(px,py,R,0,7);d.fill();
    c.setTransform(1,0,0,1,0,0);c.drawImage(dark,0,0);
    c.setTransform(DPR*SC,0,0,DPR*SC,-g.cam.x*SC*DPR,-g.cam.y*SC*DPR);
    c.globalAlpha=0.5;for(const it of g.items){if(!it.got&&it.k==='star')drawItem(c,g,it)}
    for(const pp of g.pipes)for(const E of [pp.P[0],pp.P[pp.P.length-1]]){c.strokeStyle='rgba(200,240,255,.6)';c.lineWidth=2;c.beginPath();c.arc(E.x,E.y,20,0,7);c.stroke()}
    if(g.goal)starP(c,g.goal.x,g.goal.y-108,10,'#ffd86b',g.t);
    for(const k of g.checks){c.fillStyle=k.on?'#ffd86b':'#9a8ad0';c.fillRect(k.x+1.5,k.y-56,16,10)}
    c.globalAlpha=1;
  }
  // 떠오르는 숫자
  c.font='16px "Gowun Batang", serif';c.textAlign='center';
  for(const t of g.texts){c.globalAlpha=Math.min(1,t.t*2);c.fillStyle='#ffd86b';c.fillText(t.s,t.x,t.y)}c.globalAlpha=1;
}
function drawPlayer(c,g){
  const p=g.p;if(p.inv>0&&Math.floor(p.inv*12)%2===0&&!g.done)return;
  if(p.cannon)return;
  const fx=p.x+p.w/2,fy=p.flip?p.y:p.y+p.h;
  if(p.pow==='mag'){c.strokeStyle='rgba(255,140,160,'+(0.25+0.15*Math.sin(g.t*6))+')';c.lineWidth=2;c.beginPath();c.arc(fx,fy-14,26+Math.sin(g.t*6)*3,0,7);c.stroke()}
  if(p.pow==='fly'){c.fillStyle='rgba(243,240,255,.95)';c.beginPath();c.ellipse(fx,fy+4,18,7,0,0,7);c.ellipse(fx-10,fy+1,9,6,0,0,7);c.ellipse(fx+9,fy,10,7,0,0,7);c.fill();
    c.save();c.translate(fx+14,fy-2);c.rotate(0.7);c.fillStyle='#ff9a3c';c.beginPath();c.moveTo(-3,-5);c.lineTo(3,-5);c.lineTo(0,7);c.closePath();c.fill();c.restore()}
  if(p.pow==='cape'||p.pow==='giant'){const a=p.powT<2?(Math.floor(p.powT*8)%2?0.15:0.4):0.3;const col=p.pow==='cape'?'rgba(255,230,140,'+a+')':'rgba(255,170,90,'+a+')';c.fillStyle=col;c.beginPath();c.arc(fx,fy-p.h/2,p.h*0.85,0,7);c.fill();
    if(p.pow==='cape'&&Math.random()<0.5)burst(g,fx+rnd(-12,12),fy-rnd(0,p.h),1,['#ffd86b','#ff8fb1','#9fd6ff','#b9f5a8'][Math.floor(Math.random()*4)],40)}
  const run=p.ground&&Math.abs(p.vx)>20;
  drawChar(c,play.friend,{x:fx,y:fy,face:p.face,sc:p.pow==='giant'?1.55:1,t:g.t,run,ground:p.ground||p.pow==='fly',vy:p.vy,squash:p.squash,hurt:p.inv>0.8,flip:p.flip,cape:p.pow==='cape',glide:g.fr.glide&&keys.j&&p.vy>=74});
}

// ════════════════ 화면 흐름 ════════════════
function loop(ts){
  if(!G||!G.running)return;
  let dt=Math.min(0.033,(ts-last)/1000||0.016);last=ts;
  // 빠른 움직임에서도 땅을 뚫지 않게 잘게 나눠요
  const n=dt>0.017?2:1;for(let i=0;i<n;i++){if(G&&G.running)update(dt/n)}
  if(G)draw();
  if(G&&G.running)raf=requestAnimationFrame(loop);
}
function showOv(id){['ovStart','ovPause','ovEnd'].forEach(o=>document.getElementById(o).classList.toggle('on',o===id))}
let curStage=0;
function openStage(i){
  curStage=i;go('s-game');resize();G=newGame(i);hudCache='';hud();draw();
  const st=STAGES[i],f=FR(play.friend);
  document.getElementById('stageLbl').textContent=st.id+' '+T(st.name);
  document.getElementById('startBox').innerHTML=`<h3>${st.id} ${T(st.name)}</h3><ul class="how">${T(st.tip).map(h=>`<li>${h}</li>`).join('')}</ul>
    <p class="prog" style="margin-top:8px">${T('withF',{n:T('f_'+f.id),a:T('a_'+f.id)})}</p>
    <div class="row"><button class="btn" onclick="startGame()">${T('go')}</button></div>`;
  showOv('ovStart');
}
function startGame(){ac();clearKeys();G.running=true;showOv(null);last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function restartStage(){openStage(curStage);startGame()}
function pause(){if(!G||!G.running)return;G.running=false;clearKeys();showOv('ovPause')}
function resume(){if(!G||G.done)return;clearKeys();G.running=true;showOv(null);last=performance.now();raf=requestAnimationFrame(loop)}
function leaveGame(){
  if(G&&!G.saved&&G.stars>0){bankStars(G)} // 중간에 나가도 모은 별은 지갑에
  const ww=G?G.st.w:curWorld;if(G)G.running=false;cancelAnimationFrame(raf);clearKeys();showOv(null);openMap(ww)}
function bankStars(g){if(g.saved)return;g.saved=true;play.wallet+=g.stars;play.runTotal=g.startTotal+g.stars;play.found=[...play.found,...g.foundNow];save()}
function clearStage(){const g=G;if(g.done)return;g.done=true;g.cleared=true;g.endT=1.6;g.p.vx=0;beep('clear');burst(g,g.goal.x,g.goal.y-100,30,'#ffd86b',160)}
function failStage(){const g=G;if(g.done)return;g.done=true;g.cleared=false;g.endT=0.9;beep('over')}
function foundHTML(g){
  const likes=new Set(LS.get('starLikes',[]));
  return g.foundNow.map(id=>{const b=BOOKS&&BOOKS[id];if(!b)return '';const t=LANG==='en'?b.te:b.tk,a=LANG==='en'?b.ae:b.ak;
    return `<div class="fb"><div class="fc">${b.e}${b.cov?`<img src="${b.cov}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
      <div class="ft"><b>${esc(t)}</b><span>${esc(a)}</span></div>
      <div class="fa"><button class="sbtn ${likes.has(id)?'on':''}" onclick="addLib(${id},this)">${likes.has(id)?T('added'):T('add')}</button><a class="sbtn" href="nightbooks.html?book=${id}">${T('view')}</a></div></div>`}).join('');
}
function progHTML(){const left=100-(play.runTotal%100);return `<div class="prog">${T('prog',{n:left})}<div class="bar"><i style="width:${play.runTotal%100}%"></i></div></div>`}
function showClear(){
  const g=G,st=g.st;bankStars(g);
  const rec=play.adv[st.id]||{};const isNew=!rec.clear||g.stars>(rec.best||0);
  play.adv[st.id]={clear:true,best:Math.max(rec.best||0,g.stars),time:rec.time?Math.min(rec.time,Math.round(g.t)):Math.round(g.t)};save();
  const last=g.si===STAGES.length-1,fb=foundHTML(g);
  document.getElementById('endBox').innerHTML=`<h3>${T('clearT')}</h3>${last?`<p>${T('allClear')}</p>`:''}
    <div class="big"><div>${T('stars')}<b>★ ${g.stars}${isNew&&g.stars>0?`<span class="newrec">${T('newRec')}</span>`:''}</b></div><div>${T('time')}<b>${T('sec',{s:Math.round(g.t)})}</b></div></div>
    <p class="prog">${T('bestL',{s:play.adv[st.id].best})} · ${T('walletL',{w:play.wallet})}</p>${progHTML()}
    ${fb?`<p style="margin-top:12px;font-family:'Gowun Batang',serif;color:var(--gold)">${T('foundT')}</p><div class="found">${fb}</div>`:''}
    <div class="row"><button class="btn ghost" onclick="leaveGame()">${T('toMap')}</button>${last?`<button class="btn" onclick="restartStage()">${T('again')}</button>`:`<button class="btn" onclick="openStage(${g.si+1})">${T('next')}</button>`}</div>`;
  showOv('ovEnd');
}
function showFail(){
  const g=G;bankStars(g);const fb=foundHTML(g);
  document.getElementById('endBox').innerHTML=`<h3>${T('failT')}</h3>
    <div class="big"><div>${T('stars')}<b>★ ${g.stars}</b></div></div><p class="prog">${T('failP')} ${T('walletL',{w:play.wallet})}</p>${progHTML()}
    ${fb?`<p style="margin-top:12px;font-family:'Gowun Batang',serif;color:var(--gold)">${T('foundT')}</p><div class="found">${fb}</div>`:''}
    <div class="row"><button class="btn ghost" onclick="leaveGame()">${T('toMap')}</button><button class="btn" onclick="restartStage()">${T('again')}</button></div>`;
  showOv('ovEnd');
}
function addLib(id,btn){const l=new Set(LS.get('starLikes',[]));if(l.has(id))l.delete(id);else l.add(id);LS.set('starLikes',[...l]);
  btn.classList.toggle('on',l.has(id));btn.textContent=l.has(id)?T('added'):T('add')}

// ── 지도 ──
const NODES=[[18,80],[72,64],[28,40],[76,17]];let curWorld=1;
function unlocked(i){return i===0||!!(play.adv[STAGES[i-1].id]&&play.adv[STAGES[i-1].id].clear)}
function openMap(w){
  go('s-map');document.getElementById('walletMap').textContent='★ '+play.wallet;
  const m=document.getElementById('map');
  let firstOpen=STAGES.findIndex((s,i)=>unlocked(i)&&!(play.adv[s.id]&&play.adv[s.id].clear));
  if(w)curWorld=w;else if(w===undefined&&!openMap.done){curWorld=firstOpen>=0?STAGES[firstOpen].w:2;openMap.done=1}
  const w2open=unlocked(4);if(curWorld===2&&!w2open)curWorld=1;
  document.getElementById('tWorld').textContent=T(curWorld===2?'world2':'world');
  document.getElementById('wtabs').innerHTML=[1,2].map(n=>`<button class="wtab ${curWorld===n?'on':''} ${n===2&&!w2open?'lock':''}" onclick="${n===2&&!w2open?`toast2()`:`openMap(${n})`}">${n===2&&!w2open?'🔒 ':''}${T('w'+n)}</button>`).join('');
  m.className='map w'+curWorld;
  const idx=STAGES.map((s,i)=>i).filter(i=>STAGES[i].w===curWorld);
  const pts=NODES.map(([x,y])=>`${x},${y}`);
  let svg=`<svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none">`;
  for(let i=0;i<40;i++){const x=(i*37)%100,y=(i*53)%100;svg+=`<circle cx="${x}" cy="${y}" r="${0.25+(i%3)*0.15}" fill="#fff" opacity="${0.3+(i%4)*0.12}"/>`}
  svg+=`<path d="M${NODES.map((p,i)=>i?`Q${(NODES[i-1][0]+p[0])/2+(i%2?14:-14)},${(NODES[i-1][1]+p[1])/2} ${p[0]},${p[1]}`:`${p[0]},${p[1]}`).join(' ')}" fill="none" stroke="rgba(255,216,107,.45)" stroke-width="0.8" stroke-dasharray="1.6 1.6" vector-effect="non-scaling-stroke" style="stroke-width:3px"/></svg>`;
  m.innerHTML=svg+idx.map((i,j)=>{const s=STAGES[i],op=unlocked(i),r=play.adv[s.id];
    return `<button class="node ${op?'':'lock'} ${i===firstOpen?'now':''}" style="left:${NODES[j][0]}%;top:${NODES[j][1]}%" ${op?`onclick="openStage(${i})"`:''}>
      <span class="dot">${op?s.id:'🔒'}</span><span class="nm">${T(s.name)}</span><span class="st">${op?(r&&r.clear?T('bestS',{s:r.best})+' ✓':T('newS')):T('locked')}</span></button>`}).join('');
  const row=document.getElementById('friendRow');row.innerHTML='';
  for(const f of FRIENDS){const own=play.own.includes(f.id);const b=document.createElement('button');b.className='fchip'+(play.friend===f.id?' on':'')+(own?'':' off');
    b.appendChild(portrait(f.id,52));b.insertAdjacentHTML('beforeend',`<b>${T('f_'+f.id).split(' ').pop()}</b><span>${own?(play.friend===f.id?'✓':''):'★ '+f.price}</span>`);
    b.onclick=()=>{if(own){play.friend=f.id;save();openMap(curWorld)}else openShop()};row.appendChild(b)}
}
function openShop(){
  go('s-shop');document.getElementById('walletShop').textContent='★ '+play.wallet;
  const L=document.getElementById('shopList');L.innerHTML='';
  for(const f of FRIENDS){const own=play.own.includes(f.id),d=document.createElement('div');d.className='scard';d.appendChild(portrait(f.id,72));
    let btn;if(own)btn=play.friend===f.id?`<button class="sbtn on" disabled>${T('picked')}</button>`:`<button class="sbtn" onclick="pickF('${f.id}')">${T('own')}</button>`;
    else btn=play.wallet>=f.price?`<button class="sbtn" onclick="buyF('${f.id}')">${T('buy',{p:f.price})}</button>`:`<button class="sbtn" disabled>${T('buy',{p:f.price})}<br><small>${T('need',{n:f.price-play.wallet})}</small></button>`;
    d.insertAdjacentHTML('beforeend',`<div class="si"><h2>${T('f_'+f.id)}</h2><p>${T('a_'+f.id)}</p></div><div class="sb">${btn}</div>`);L.appendChild(d)}
}
function buyF(id){const f=FR(id);if(play.own.includes(id)||play.wallet<f.price)return;play.wallet-=f.price;play.own.push(id);play.friend=id;save();beep('buy');openShop()}
function pickF(id){play.friend=id;save();openShop()}
function toast2(){const e=document.getElementById('wtabs');e.dataset.msg=T('lockW');e.classList.add('msg');setTimeout(()=>e.classList.remove('msg'),1600)}
function drawHub(){
  const c=STAGES.filter(s=>play.adv[s.id]&&play.adv[s.id].clear).length;
  document.getElementById('advBest').textContent=(c||play.wallet)?T('advBest',{c,n:STAGES.length,w:play.wallet}):T('advNone');
}

applyText();sndIcon();drawHub();loadBooks();
if(location.hash==='#map')openMap();
</script>
