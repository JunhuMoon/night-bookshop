<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161B47">
<title>미리내 마법학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#161B47;
  --sky2:#1C2152;
  --panel:#232A66;
  --ink:#EDE6D3;
  --soft:#A9A6C7;
  --gold:#E9C46A;
  --parch:#F3EAD3;
  --parch-ink:#2B2548;
  --line:rgba(237,230,211,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:'Dongle',sans-serif;font-size:23px;line-height:1.25;min-height:100vh}
button,input{font:inherit;color:inherit}
input{font-family:'Dongle',sans-serif}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.hz{font-family:'Noto Serif KR',serif;font-weight:900}

#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;border-radius:50%;background:#FFF6DC;opacity:.6;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}

#app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));min-height:calc(100vh / var(--z,1));zoom:var(--z,1)}
.scr{display:none;flex-direction:column;justify-content:center;min-height:calc(100vh / var(--z,1) - 48px)}
.scr.on{display:flex}

.btn{display:block;width:100%;padding:14px;border-radius:14px;font-size:24px;font-weight:700;text-align:center}
.btn.gold{background:var(--gold);color:var(--parch-ink)}
.btn.gold:active{transform:translateY(2px)}
.btn.ghost{border:1px solid var(--line);background:rgba(255,255,255,.05)}
.btn:disabled{opacity:.4;pointer-events:none}
.small{font-size:18px;color:var(--soft)}
.center{text-align:center}

/* ---------- 교문 ---------- */
.gate{margin:0 auto;width:100%;max-width:420px}
.gate svg{width:100%;height:auto;display:block}
.gate-title{text-align:center;margin-top:18px}
.gate-title h1{font-size:48px;font-weight:700;letter-spacing:-.5px;color:var(--parch)}
.gate-title p{color:var(--soft);font-size:20px;margin-top:4px}
.spacer{height:24px;flex:none}

/* ---------- 친구 고르기 ---------- */
.head{text-align:center;margin-bottom:12px}
.head .t1{font-size:19px;color:var(--soft)}
.head .t2{font-size:28px;font-weight:700;color:var(--parch)}
.stage{display:flex;align-items:center;gap:8px}
.navb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:28px;flex:none}
.pic{flex:1;height:310px;display:flex;align-items:flex-end;justify-content:center;background:var(--panel);border-radius:18px;overflow:hidden;touch-action:pan-y}
.pic svg{height:296px;width:auto}
.nm{text-align:center;font-size:34px;font-weight:700;margin-top:12px}
.tag{text-align:center;font-size:20px;margin-bottom:12px}
.card{background:var(--parch);color:var(--parch-ink);border-radius:16px;padding:14px 16px;font-size:21px;line-height:1.25}
.card .row{display:flex;gap:10px}
.card .row b{flex:none;width:66px;font-weight:500;color:#6E6690}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block;transition:all .2s}
.dots i.on{background:var(--gold);width:18px;border-radius:999px}

/* ---------- 이름 ---------- */
.mini{width:100%;height:230px;margin:4px auto 10px;background:var(--panel);border-radius:18px;display:flex;align-items:flex-end;justify-content:center}
.mini svg{height:218px;width:auto}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);margin-top:10px}
.opt .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--soft);flex:none;display:grid;place-items:center}
.opt.on{border-color:var(--gold);background:rgba(233,196,106,.1)}
.opt.on .ck{border-color:var(--gold)}
.opt .lvsub{color:var(--gold)}
.opt.on .ck::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.opt b{font-weight:500;display:block}
.field{width:100%;margin-top:10px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);font-size:24px}
.field:focus{outline:none;border-color:var(--gold)}
.err{min-height:20px;font-size:18px;color:#F29C9C;margin-top:6px}

/* ---------- 학생증 ---------- */
.idcard{background:var(--parch);color:var(--parch-ink);border-radius:18px;overflow:hidden;margin-top:6px;animation:rise .5s cubic-bezier(.3,1.3,.5,1)}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
.idtop{background:#2C3474;color:var(--parch);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.idtop b{font-weight:700;font-size:22px}
.idtop .hz{font-size:20px;color:var(--gold);letter-spacing:2px}
.idbody{display:flex;gap:16px;padding:20px 18px}
.idphoto{width:132px;height:168px;border-radius:12px;background:#232A66;flex:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.idphoto svg{height:162px;width:auto}
.idinfo{flex:1;display:flex;flex-direction:column;gap:6px;font-size:20px}
.idinfo .k{color:#6E6690;font-size:18px}
.idinfo .v{font-weight:700;font-size:25px;margin-top:-4px}
.idspell{display:inline-flex;align-items:center;gap:6px}
.idspell .hz{font-size:22px}
.idfoot{border-top:1px dashed rgba(43,37,72,.2);padding:10px 16px;font-size:18px;color:#6E6690;display:flex;justify-content:space-between}

/* ---------- 복도 ---------- */
.me{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.me .face{width:64px;height:64px;border-radius:50%;background:var(--panel);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.me .face svg{height:118px;width:auto;margin-bottom:-48px}
.me b{font-weight:700;font-size:25px}
.me span{font-size:18px;color:var(--soft);display:block;line-height:1.2}
.hall-title{font-size:31px;font-weight:700;margin:18px 0 4px;color:var(--parch)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.room{border-radius:18px;border:1.5px dashed #3A4190;padding:30px 12px;text-align:center;background:rgba(255,255,255,.03)}
.room .ic{font-size:53px;filter:grayscale(.6);opacity:.7}
.room b{display:block;font-weight:700;font-size:24px;margin-top:6px}
.room span{font-size:18px;color:var(--soft)}
.room.next{border-style:solid;border-color:var(--gold)}
.room.next .ic{filter:none;opacity:1}
.room.next span{color:var(--gold)}
.foot-links{display:flex;justify-content:center;margin-top:8px}
.link{font-size:19px;color:var(--soft);text-decoration:underline;text-underline-offset:3px;padding:6px}

.modal{position:fixed;inset:0;background:rgba(10,12,40,.7);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--sky2);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:340px;width:100%}
.modal p{margin-bottom:16px}
.modal .row2{display:flex;gap:10px}
.modal .row2 .btn{flex:1}

/* ---------- 급식실 ---------- */
.room.open{border-style:solid;border-color:var(--gold);background:rgba(233,196,106,.08);cursor:pointer}
.room.open .ic{filter:none;opacity:1}
.room.open span{color:var(--gold)}
.room.open:active{transform:scale(.97)}
.cbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cbar h2{flex:1;font-size:28px;font-weight:700;color:var(--parch)}
.icb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:24px;display:grid;place-items:center;flex:none}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.hearts{font-size:25px;letter-spacing:2px}
.tbar{height:9px;border-radius:999px;background:rgba(255,255,255,.1);margin:8px 0 12px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);border-radius:999px;width:100%}
.tbar i.low{background:#F29C9C}
.hallc{background:#2A2F6E;border-radius:18px;padding:12px 12px 0;position:relative;overflow:hidden}
.bub{background:var(--parch);color:var(--parch-ink);border-radius:16px;padding:12px 14px;font-size:24px;font-weight:700;position:relative;margin-bottom:12px;min-height:56px;display:flex;align-items:center;gap:10px}
.bub .em{font-size:39px;flex:none}
.bub .kw{color:#B8342A;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:rgba(233,196,106,.9)}
.bub .conn{display:block;font-size:20px;font-weight:500;color:#2B6B63;margin-top:2px}
.bub.sad .conn{color:#9A3B3B}
.bub .conn .hz{font-size:18px}
.plate.hint{animation:glow .6s ease-in-out 3;background:#FFF4CC}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--gold),0 4px 0 #CDBF9D}}
.bub::after{content:"";position:absolute;left:44px;bottom:-9px;border:9px solid transparent;border-top-color:var(--parch);border-bottom:0}
.bub.happy{background:#D9F3EE}
.bub.happy::after{border-top-color:#D9F3EE}
.bub.sad{background:#F9DADA}
.bub.sad::after{border-top-color:#F9DADA}
.queue{display:flex;align-items:flex-end;gap:2px;height:170px;position:relative}
.stu{display:flex;flex-direction:column;align-items:center;transition:transform .35s,opacity .35s}
.stu svg{display:block;width:auto}
.stu.front svg{height:164px}
.stu.q1 svg{height:122px;opacity:.9}
.stu.q2 svg{height:100px;opacity:.75}
.stu.q3 svg{height:84px;opacity:.6}
.stu.leave{transform:translateX(-120%);opacity:0}
.stu.mad{animation:shake .4s}
.pat{position:absolute;left:12px;bottom:18px;width:96px;height:7px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.pat i{display:block;height:100%;width:100%;background:#72D3C9;border-radius:999px}
.pat i.low{background:#F29C9C}
.countertop{height:16px;background:#6B4A34;border-top:3px solid #8A6444;margin:0 -12px}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.plate{background:var(--parch);color:var(--parch-ink);border-radius:16px;padding:10px 4px 8px;text-align:center;box-shadow:0 4px 0 #CDBF9D}
.plate:active{transform:translateY(3px);box-shadow:0 1px 0 #CDBF9D}
.plate .h{font-family:'Noto Serif KR',serif;font-weight:900;font-size:36px;line-height:1.15}
.plate .f{font-size:18px;color:#6E6690;transition:opacity .4s}
.plate .f.dim{opacity:.35}
.plate .f.hide{visibility:hidden}
.plate:disabled{cursor:default}
.bub .em.two{font-size:30px;letter-spacing:-4px}
.bub .got .kw{color:#2E8A6A;text-decoration-color:rgba(46,138,106,.5)}
.bub .chk{color:#2E9E6A;font-size:26px;margin-right:3px}
.bub .kw .sy{color:#2E8A6A}
.lvtag{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:0 8px;font-size:18px;margin-left:4px;vertical-align:middle}
.plate.ok{background:#D9F3EE;box-shadow:0 4px 0 #9CCFC6}
.plate.no{background:#F9DADA;box-shadow:0 4px 0 #D9A5A5;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.over{position:absolute;inset:0;background:rgba(22,27,71,.98);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border-radius:18px;z-index:5}
.over.on{display:flex}
.cwrap{position:relative;min-height:600px}
.rules{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-size:20px;line-height:1.3;margin:12px 0 18px;width:100%}
.big-n{font-size:67px;font-weight:700;color:var(--gold);line-height:1.1}
.review{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 16px;max-height:220px;overflow:auto}
.review div{background:rgba(255,255,255,.06);border-radius:10px;padding:6px 8px;font-size:18px;text-align:left;display:flex;align-items:center;gap:6px}
.review .hz{font-size:20px;color:var(--gold)}
.row2x{display:flex;gap:10px;width:100%}
.row2x .btn{flex:1}

/* ---------- 동글 글씨체 ---------- */
:root{--cute:'Dongle','Noto Sans KR',sans-serif}
.gate-title h1{font-family:var(--cute);font-size:54px;font-weight:700;line-height:1.05;letter-spacing:0}
.gate-title p{font-family:var(--cute);font-size:23px;line-height:1.05}
.head .t1{font-family:var(--cute);font-size:22px;line-height:1.1}
.head .t2{font-family:var(--cute);font-size:34px;line-height:1.05}
.nm{font-family:var(--cute);font-size:40px;line-height:1.05}
.tag{font-family:var(--cute);font-size:23px;line-height:1.1}
.btn{font-family:var(--cute);font-size:28px;font-weight:700;line-height:1.1;padding:10px 14px}
.opt b{font-family:var(--cute);font-size:25px;font-weight:400;line-height:1.1}
.idtop b{font-family:var(--cute);font-size:26px;line-height:1.1}
.idinfo .k{font-family:var(--cute);font-size:19px;line-height:1}
.idinfo .v{font-family:var(--cute);font-size:30px;line-height:1.05}
.me b{font-family:var(--cute);font-size:30px;line-height:1.05}
.hall-title{font-family:var(--cute);font-size:36px;line-height:1.1}
.room b{font-family:var(--cute);font-size:28px;font-weight:700;line-height:1.1}
.room span{font-family:var(--cute);font-size:20px}
.link{font-family:var(--cute);font-size:21px}
.cbar h2{font-family:var(--cute);font-size:34px;line-height:1.1}
.stat{font-family:var(--cute);font-size:24px;line-height:1.1}
.bub{font-family:var(--cute);font-size:27px;font-weight:400;line-height:1.1}
.bub .conn{font-family:var(--cute);font-size:22px;line-height:1.15}
.plate .f{font-family:var(--cute);font-size:19px;line-height:1.1}
.big-n{font-family:var(--cute);font-size:76px;line-height:1}
.over > div, .over .small{font-family:var(--cute)}
.review div{font-family:var(--cute);font-size:19px;line-height:1.1}
.err{font-family:var(--cute);font-size:20px}

/* ---------- 나머지 글씨도 모두 동글로 ---------- */
body{font-family:var(--cute);font-size:23px;line-height:1.25}
.small{font-size:20px;line-height:1.15}
.card{font-size:22px;line-height:1.25}
.card .row b{width:74px;font-weight:400}
.opt .small{font-size:19px}
.field{font-size:24px;padding:8px 14px}
.idfoot{font-size:18px}
.idinfo{font-size:21px}
.me span{font-size:19px;line-height:1.1}
.rules{font-size:22px;line-height:1.3}
.modal p{font-size:23px;line-height:1.3}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<div id="app">

  <!-- 교문 -->
  <section class="scr on" id="sGate">
    <div class="gate" id="gateArt"></div>
    <div class="gate-title">
      <h1>미리내 마법학교</h1>
      <p>교문의 글씨를 읽을 수 있게 되면<br>무언가 일어날지도 몰라요</p>
    </div>
    <div class="spacer"></div>
    <button class="btn gold" id="bEnter">입학하기</button>
  </section>

  <!-- 친구 고르기 -->
  <section class="scr" id="sPick">
    <div class="head"><div class="t1">함께 입학할 친구를 골라주세요</div><div class="t2">미리내 마법학교</div></div>
    <div class="stage">
      <button class="navb" id="bPrev" aria-label="이전 친구">‹</button>
      <div class="pic" id="pPic"></div>
      <button class="navb" id="bNext" aria-label="다음 친구">›</button>
    </div>
    <div class="nm" id="pName"></div>
    <div class="tag" id="pTag"></div>
    <div class="card" id="pCard"></div>
    <div class="dots" id="pDots"></div>
    <div class="spacer"></div>
    <button class="btn gold" id="bChoose"></button>
  </section>

  <!-- 이름 정하기 -->
  <section class="scr" id="sName">
    <div class="head"><div class="t1">학생증에 쓸 이름을 정해요</div><div class="t2">이름 정하기</div></div>
    <div class="mini" id="nPic"></div>
    <button class="opt on" id="oKeep"><span class="ck"></span><span><b id="oKeepT"></b><span class="small">캐릭터 이름을 그대로 써요</span></span></button>
    <button class="opt" id="oMine"><span class="ck"></span><span><b>내 이름을 적을래요</b><span class="small">최대 8글자</span></span></button>
    <input class="field" id="nInput" placeholder="이름을 적어주세요" autocomplete="off" style="display:none">
    <div class="err" id="nErr"></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" id="bBackPick" style="flex:1">다시 고르기</button>
      <button class="btn gold" id="bDone" style="flex:2">다음</button>
    </div>
  </section>

  <!-- 학생증 -->
  <section class="scr" id="sLevel">
    <div class="head"><div class="t1">지금 아는 만큼 골라요</div><div class="t2" id="lvTitle">급수 고르기</div></div>
    <div id="lvOpts">
      <button class="opt" data-lv="8"><span class="ck"></span><span><b>8급 <span class="lvsub">처음 배워요</span></b><span class="small">한자 50자 · 한 글자로 주문</span></span></button>
      <button class="opt" data-lv="7"><span class="ck"></span><span><b>7급 <span class="lvsub">조금 알아요</span></b><span class="small">한자 150자 · 두 글자 낱말로 주문</span></span></button>
      <button class="opt" data-lv="6"><span class="ck"></span><span><b>6급 <span class="lvsub">꽤 알아요</span></b><span class="small">한자 300자 · 문제 준비 중</span></span></button>
    </div>
    <p class="small" id="lvNote" style="text-align:center;margin-top:10px">나중에 복도에서 바꿀 수 있어요</p>
    <div class="spacer"></div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" id="lvBack" style="flex:1">이전</button>
      <button class="btn gold" id="lvDone" style="flex:2">입학 완료</button>
    </div>
  </section>
  <section class="scr" id="sCard">
    <div class="head"><div class="t1">입학을 축하해요!</div><div class="t2">나의 학생증</div></div>
    <div class="idcard" id="idCard"></div>
    <p class="small center" style="margin-top:14px" id="idMsg"></p>
    <div class="spacer"></div>
    <button class="btn gold" id="bIn">학교 안으로 들어가기</button>
  </section>

  <!-- 복도 -->
  <section class="scr" id="sHall">
    <div class="me" id="hMe"></div>
    <div class="hall-title">1층 복도</div>
    <p class="small">아직 공사 중인 곳이 많아요. 곧 하나씩 문이 열릴 거예요.</p>
    <div class="rooms">
      <button class="room open" id="goCafe"><div class="ic">🍛</div><b>급식실</b><span>배식 당번</span></button>
      <div class="room"><div class="ic">📖</div><b>교실</b><span>공사 중</span></div>
      <div class="room"><div class="ic">🏃</div><b>운동장</b><span>공사 중</span></div>
      <div class="room"><div class="ic">📚</div><b>도서관</b><span>공사 중</span></div>

const nfc=t=>{ try{ return String(t).normalize('NFC'); }catch(e){ return String(t); } };

// 받침에 따라 "으로/로"를 골라요 (ㄹ 받침은 "로")
function ie(word){
  const ch=nfc(word).trim().slice(-1), code=ch.charCodeAt(0)-0xAC00;
  if(code<0||code>11171) return '이에요';
  return code%28===0?'예요':'이에요';
}
function ro(word){
  const ch=nfc(word).trim().slice(-1), code=ch.charCodeAt(0)-0xAC00;
  if(code<0||code>11171) return '(으)로';
  const jong=code%28;
  return (jong===0||jong===8)?'로':'으로';
}

const HUNALL={...HUN8,...HUN7};
MENU.forEach(m=>{ m.type='dish'; m.hzs=[m.hz]; });
const W7=WORDS7.map(([kw,hz,dish,em],i)=>({id:'w'+i,type:'word',kw,hzs:[...hz],dish,em}));
// 음 (두음법칙으로 바뀌는 소리도 같이 봐요)
const DU={'녀':'여','년':'연','륙':'육','력':'역','립':'입','래':'내','로':'노','리':'이','림':'임'};
const eumOf=h=>{ const e=(HUNALL[h]||'').slice(-1); return [e,DU[e]].filter(Boolean); };
// 받침이 있으면 "은", 없으면 "는"
function eun(word){
  const ch=nfc(word).trim().slice(-1), code=ch.charCodeAt(0)-0xAC00;
  if(code<0||code>11171) return '은(는)';
  return code%28===0?'는':'은';
}
// 카드 섞기처럼 뽑아요: 한 바퀴 다 나오기 전에는 같은 메뉴가 다시 나오지 않아요
const BAGS={};
function drawFrom(name,list,avoidHz){
  const ok=it=>!it.hzs.some(h=>avoidHz.includes(h));
  if(!BAGS[name]||!BAGS[name].length) BAGS[name]=shuf(list);
  const bag=BAGS[name];
  let k=bag.findIndex(ok);
  if(k<0){ const fresh=shuf(list).filter(x=>!bag.includes(x)); k=fresh.findIndex(ok); if(k>=0) return fresh[k]; return bag.shift(); }
  return bag.splice(k,1)[0];
}
function myLevel(){ return (ST&&ST.level)||'8'; }
// 주문 만들기: 8급은 메뉴 1~2개, 7급·6급은 두 글자 낱말 메뉴 (가끔 8급 복습 메뉴)
function makeOrder(served,avoid){
  if(myLevel()==='8'){
    const n=orderSize(served), items=[];
    for(let k=0;k<n;k++) items.push(drawFrom('m8',MENU,[...avoid,...items.flatMap(m=>m.hzs)]));
    return items;
  }
  return [Math.random()<.7 ? drawFrom('w7',W7,avoid) : drawFrom('m8',MENU,avoid)];
}
function orderSize(n){ if(n<3) return 1; if(n<8) return Math.random()<.6?2:1; return 2; }
let CF=null, soundOn=LS.get('mirinae_sound')!==false;

let AC=null;
function beep(type){
  if(!soundOn) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const now=AC.currentTime;
    const t=(f,s,d,v=.05,w='sine')=>{ const o=AC.createOscillator(),g=AC.createGain(); o.type=w; o.frequency.value=f;
      g.gain.setValueAtTime(0,now+s); g.gain.linearRampToValueAtTime(v,now+s+.02); g.gain.exponentialRampToValueAtTime(.0001,now+s+d);
      o.connect(g).connect(AC.destination); o.start(now+s); o.stop(now+s+d+.05); };
    if(type==='ok'){ t(880,0,.18); t(1320,.07,.22,.035); }
    if(type==='no'){ t(240,0,.22,.05,'triangle'); }
    if(type==='mad'){ t(300,0,.15,.05,'triangle'); t(200,.14,.25,.05,'triangle'); }
    if(type==='end'){ [523,659,784,1047].forEach((f,i)=>t(f,i*.1,.35,.04)); }
  }catch(e){}
}
function paintSnd(){ $('cSnd').textContent=soundOn?'🔊':'🔇'; }
$('cSnd').onclick=()=>{ soundOn=!soundOn; LS.set('mirinae_sound',soundOn); paintSnd(); };

function openCafe(){
  stopCafe();
  $('cStart').classList.add('on'); $('cEnd').classList.remove('on');
  const best=(LS.get(bestKey())||0);
  $('cBestTxt').textContent= best?`${myLevel()}급 최고 기록 ${best}명`:'';
  const lv=myLevel();
  $('cRules').innerHTML = lv==='8'
    ? `학생이 마법 메뉴를 한두 개 주문해요.<br>메뉴에 들어간 <b>한자</b>를 찾아 반찬통을 모두 눌러주세요.<br>틀린 한자를 누르거나 너무 늦으면 ❤️이 하나 줄어요.<br>점심시간은 <b>60초</b>! 몇 명에게 줄 수 있을까요?`
    : `${lv}급 배식이에요. 메뉴 속 <b>두 글자 낱말</b>을 보고<br>그 낱말의 <b>한자 두 개</b>를 모두 찾아 눌러주세요.<br>8급 복습 메뉴도 가끔 나와요.<br>틀린 한자를 누르거나 너무 늦으면 ❤️이 하나 줄어요.${lv==='6'?'<br><span class="small">6급 문제는 준비 중이라 지금은 7급 문제가 나와요.</span>':''}`;
  $('cLvTag').textContent=lv+'급';
  $('cHearts').textContent='❤️❤️❤️'; $('cServed').textContent='배식 0명'; $('cTime').textContent='60초';
  $('cBar').style.width='100%';
  $('cBub').className='bub'; $('cBub').innerHTML='<span class="em">🍽️</span><span>학생들이 줄을 서고 있어요</span>';
  $('cQueue').innerHTML=''; $('cPlates').innerHTML=''; $('cPatBar').style.width='100%';
  paintSnd(); show('sCafe');
}
$('goCafe').onclick=openCafe;
$('cBack').onclick=()=>{ stopCafe(); paintHall(); show('sHall'); };

function bestKey(){ return myLevel()==='8'?'mirinae_cafe_best':'mirinae_cafe_best_'+myLevel(); }
function stopCafe(){ if(CF){ cancelAnimationFrame(CF.raf); CF=null; } }

const VAR=[
  {base:'haeon',   sw:{'#F07A5A':'#6B4A2E','#E0513B':'#3FA7A0','#B83A27':'#2E7F7A','#C8432F':'#338F89'}},
  {base:'haeon',   sw:{'#F07A5A':'#2B2548','#E0513B':'#E9A23B','#B83A27':'#B87A1E','#C8432F':'#C98A2A'}},
  {base:'mulgyeol',sw:{'#A9CFF5':'#F6C177','#2E86DE':'#E0513B','#2E5FA8':'#8A3F5A'}},
  {base:'mulgyeol',sw:{'#A9CFF5':'#3A2B25','#2E86DE':'#3FAE5A','#2E5FA8':'#2F6A48'}},
  {base:'saessak', sw:{'#9ED99A':'#3A2B25','#3FAE5A':'#E9A23B','#2F7A45':'#8A5A2B','#2A6A3C':'#6B4A2E'}},
  {base:'saessak', sw:{'#9ED99A':'#F6C177','#3FAE5A':'#6D4BC7','#2F7A45':'#4E34A0','#2A6A3C':'#3E2A86'}},
  {base:'dalbit',  sw:{'#D8CCF7':'#F4B6C8','#6D4BC7':'#2E86DE','#4E34A0':'#1F4E8C'}},
  {base:'dalbit',  sw:{'#D8CCF7':'#6B4A2E','#6D4BC7':'#E0513B','#4E34A0':'#9A2E22'}},
];
const CLASSMATES=VAR.map((v,k)=>{
  const b=CH.find(c=>c.id===v.base);
  let svg=b.svg.replace(/<text[^>]*>[^<]*<\/text>/,'');   // 지팡이 한자는 빼요
  for(const [a,z] of Object.entries(v.sw)) svg=svg.split(a).join(z);
  return {id:'mate'+k,n:'친구',svg};
});
function newStudent(){
  const mine=ST&&ST.char;
  const pool=CH.filter(c=>c.id!==mine).concat(CLASSMATES);
  const last=CF&&CF.queue&&CF.queue.length?CF.queue[CF.queue.length-1].c.id:null;
  let c; do{ c=pool[Math.floor(Math.random()*pool.length)]; }while(c.id===last && pool.length>1);
  return {c};   // 주문은 맨 앞에 섰을 때 정해요
}
function startCafe(){
  $('cStart').classList.remove('on');
  CF={time:60, hearts:3, served:0, log:[], queue:[], reveal:new Set(), prevHz:[],
      pat:0, patMax:7, last:performance.now(), raf:0, lock:false};
  for(let k=0;k<4;k++) CF.queue.push(newStudent());
  nextOrder();
  CF.raf=requestAnimationFrame(tick);
}
$('cGo').onclick=startCafe;

function patienceFor(n){ return Math.max(4.2, 7.5-n*0.2); }  // 처음 7.5초 → 최소 4.2초
// 뜻과 음: 10명까지 보이고, 20명까지 흐리게, 그다음 숨겨요. 이번 판에 틀린 한자는 계속 보여요
function hunClass(hz){
  if(CF.reveal.has(hz) || CF.served<10) return 'f';
  return CF.served<20 ? 'f dim' : 'f hide';
}
function nextOrder(){
  const front=CF.queue[0];
  const items=makeOrder(CF.served, CF.prevHz);
  front.items=items; front.got=items.map(it=>it.hzs.map(()=>false));
  CF.prevHz=items.flatMap(it=>it.hzs);
  const taps=CF.prevHz.length;
  CF.patMax=patienceFor(CF.served)*(taps>1?1.6:1); CF.pat=CF.patMax;
  paintQueue(); paintOrder();
  const need=[...new Set(CF.prevHz)];
  const syl=new Set(items.flatMap(it=>it.type==='word'?[...it.kw]:eumOf(it.hz)));
  const pool=myLevel()==='8'?Object.keys(HZ):Object.keys(HUNALL);
  // 헷갈리지 않게, 주문 속 소리와 같은 소리의 한자는 빼요
  const others=shuf(pool.filter(h=>!need.includes(h) && !eumOf(h).some(e=>syl.has(e)))).slice(0,6-need.length);
  const six=shuf([...need,...others]);
  $('cPlates').innerHTML=six.map(h=>`<button class="plate" data-h="${h}"><div class="h">${h}</div><div class="${hunClass(h)}">${HUNALL[h]}</div></button>`).join('');
  $('cPlates').querySelectorAll('.plate').forEach(b=>b.onclick=()=>serve(b));
  CF.lock=false;
}
// 메뉴 이름 속 핵심 낱말: 낱말 메뉴는 찾은 글자가 초록색이 돼요
function itemHTML(it,got){
  if(it.type==='dish'){
    const all=got.every(x=>x);
    return `<span class="${all?'got':''}">${all?'<b class="chk">✓</b>':''}${dishHTML(it)}</span>`;
  }
  const all=got.every(x=>x);
  const kw=`<span class="kw">${[...it.kw].map((s,i)=>`<span class="${got[i]?'sy':''}">${s}</span>`).join('')}</span>`;
  return `<span class="${all?'got':''}">${all?'<b class="chk">✓</b>':''}${it.dish.replace(it.kw,kw)}</span>`;
}
function paintOrder(){
  const s=CF.queue[0], it=s.items;
  const txt=it.length===1 ? `${itemHTML(it[0],s.got[0])} 주세요!` : `${itemHTML(it[0],s.got[0])}${rang(it[0].dish)} ${itemHTML(it[1],s.got[1])} 주세요!`;
  $('cBub').className='bub';
  $('cBub').innerHTML=`<span class="em${it.length>1?' two':''}">${it.map(m=>m.em).join('')}</span><span>${txt}</span>`;
}
function connHTML(it){
  if(it.type==='dish') return `${it.kw} = <span class="hz">${it.hz}</span> ${it.hun}`;
  return `${it.kw} = <span class="hz">${it.hzs.join('')}</span> ${it.hzs.map(h=>HUNALL[h]).join(' + ')}`;
}
function paintQueue(){
  const cls=['front','q1','q2','q3'];
  $('cQueue').innerHTML=CF.queue.slice(0,4).map((s,i)=>`<div class="stu ${cls[i]}" ${i===0?'id="cFront"':''}>${drawChar(s.c)}</div>`).join('');
}
function serve(b){
  if(!CF || CF.lock) return;
  const s=CF.queue[0], h=b.dataset.h;
  let hit=null;
  s.items.forEach((it,i)=>it.hzs.forEach((x,j)=>{ if(!hit && x===h && !s.got[i][j]) hit=[i,j]; }));
  if(hit){
    s.got[hit[0]][hit[1]]=true; b.classList.add('ok'); b.disabled=true; beep('ok');
    if(s.got.every(g=>g.every(x=>x))){
      // 다 담았어요: 친구가 인사하고 떠나요
      CF.lock=true; CF.served++; s.items.forEach(m=>CF.log.push(m));
      $('cServed').textContent=`배식 ${CF.served}명`;
      $('cBub').className='bub happy';
      $('cBub').innerHTML=`<span class="em">😋</span><span>고마워요!${s.items.map(m=>`<span class="conn">${connHTML(m)}</span>`).join('')}</span>`;
      const f=$('cFront'); if(f) f.classList.add('leave');
      setTimeout(()=>{ if(!CF) return; CF.queue.shift(); CF.queue.push(newStudent()); nextOrder(); },s.items.length>1||s.items[0].type==='word'?1300:900);
    }else paintOrder();
  }else{
    b.classList.add('no'); beep('no'); b.disabled=true;
    // 아직 못 찾은 한자들
    const left=[]; s.items.forEach((it,i)=>it.hzs.forEach((x,j)=>{ if(!s.got[i][j]) left.push({it,j,hz:x}); }));
    const L=left[0], it=L.it;
    const msg= it.type==='dish'
      ? `${it.why} <span class="hz">${it.hz}</span> ${it.hun}${ie(it.hun)}`
      : `${it.kw}의 '${it.kw[L.j]}'${eun(it.kw[L.j])} <span class="hz">${L.hz}</span> ${HUNALL[L.hz]}${ie(HUNALL[L.hz])}`;
    // 정답 한자와 방금 누른 한자는 이번 판 동안 뜻과 음을 다시 보여줘요
    left.forEach(x=>CF.reveal.add(x.hz)); CF.reveal.add(h);
    $('cPlates').querySelectorAll('.plate').forEach(p=>{ const f=p.querySelector('.f'); if(f) f.className=hunClass(p.dataset.h); });
    left.forEach(x=>{ const r=$('cPlates').querySelector(`.plate[data-h="${x.hz}"]`); if(r){ r.classList.remove('hint'); void r.offsetWidth; r.classList.add('hint'); } });
    loseHeart(`앗, 그건 아니에요!<span class="conn">${msg}</span>`);
  }
}
function loseHeart(msg){
  CF.hearts--;
  $('cHearts').textContent='❤️'.repeat(Math.max(0,CF.hearts))+'🤍'.repeat(3-Math.max(0,CF.hearts));
  const f=$('cFront'); if(f){ f.classList.remove('mad'); void f.offsetWidth; f.classList.add('mad'); }
  if(msg){
    const front=CF.queue[0];
    $('cBub').className='bub sad';
    $('cBub').innerHTML=`<span class="em">😣</span><span>${msg}</span>`;
    setTimeout(()=>{ if(!CF||CF.lock||CF.queue[0]!==front) return; paintOrder(); },1800);
  }
  if(CF.hearts<=0) endCafe('하트를 모두 잃었어요');
}
function tick(t){
  if(!CF) return;
  const dt=Math.min(.1,(t-CF.last)/1000); CF.last=t;
  CF.time-=dt;
  if(!CF.lock) CF.pat-=dt;
  const tl=Math.max(0,CF.time);
  $('cTime').textContent=Math.ceil(tl)+'초';
  $('cBar').style.width=(tl/60*100)+'%';
  $('cBar').classList.toggle('low',tl<=10);
  const pr=Math.max(0,CF.pat/CF.patMax);
  $('cPatBar').style.width=(pr*100)+'%';
  $('cPatBar').classList.toggle('low',pr<.35);
  if(CF.time<=0){ endCafe('점심시간이 끝났어요'); return; }
  if(CF.pat<=0 && !CF.lock){
    CF.lock=true; beep('mad');
    $('cBub').className='bub sad';
    $('cBub').innerHTML=`<span class="em">😤</span><span>너무 오래 걸려요! 그냥 갈래요</span>`;
    const f=$('cFront'); if(f) f.classList.add('leave');
    loseHeart();
    if(!CF) return;
    setTimeout(()=>{ if(!CF) return; CF.queue.shift(); CF.queue.push(newStudent()); nextOrder(); },700);
  }
  CF.raf=requestAnimationFrame(tick);
}
function endCafe(why){
  if(!CF) return;
  const n=CF.served, log=CF.log;
  cancelAnimationFrame(CF.raf); CF=null;
  const bk=bestKey(); const best=LS.get(bk)||0;
  const rec=n>best; if(rec) LS.set(bk,n);
  beep('end');
  // 오늘 배식한 메뉴 (중복 없이)
  const seen={}; const uniq=log.filter(m=>seen[m.id]?false:(seen[m.id]=true));
  $('cEnd').innerHTML=`
    <div class="small">${why}</div>
    <div class="big-n" style="margin-top:6px">${n}명</div>
    <div style="margin-top:4px">${rec?'🎉 새 기록이에요!':`최고 기록 ${Math.max(best,n)}명`}</div>
    ${uniq.length?`<div class="small" style="margin-top:14px;align-self:flex-start">오늘 배식한 메뉴</div>
    <div class="review">${uniq.map(m=>`<div><span class="hz">${m.hzs.join('')}</span><span><b style="font-weight:500">${m.kw}</b> = ${m.hzs.map(h=>HUNALL[h]).join(' + ')}<br><span class="small">${m.dish}</span></span></div>`).join('')}</div>`:'<div style="height:18px"></div>'}
    <div class="row2x"><button class="btn ghost" id="cHall">복도로</button><button class="btn gold" id="cAgain">한 번 더</button></div>`;
  $('cEnd').classList.add('on');
  $('cAgain').onclick=()=>{ $('cEnd').classList.remove('on'); startCafe(); };
  $('cHall').onclick=()=>{ paintHall(); show('sHall'); };
}

/* 시작: 이미 입학했다면 복도로 */
if(ST && ST.char){ pick=Math.max(0,CH.findIndex(x=>x.id===ST.char)); paintHall(); show('sHall'); }
