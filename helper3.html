<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>밤하늘 책방 · 표지 모으기 도우미 (탐정 버전)</title>
<style>
body{font-family:'Malgun Gothic',sans-serif;background:#141842;color:#eef0ff;max-width:760px;margin:0 auto;padding:24px;line-height:1.6}
h1{color:#ffd86b}.box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:18px;margin:16px 0}
input{width:100%;font-size:18px;padding:12px;border-radius:10px;border:1px solid #888;box-sizing:border-box}
button{font-size:20px;padding:12px 26px;border-radius:999px;border:none;background:#ffd86b;color:#2a1d4d;cursor:pointer;margin-top:12px;font-weight:bold}
button:disabled{opacity:.5}
#bar{height:14px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:12px}#bar i{display:block;height:100%;width:0;background:#ffd86b;transition:width .2s}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:12px}
#grid img{width:100%;border-radius:4px}#grid .no{aspect-ratio:2/3;background:#333;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
textarea{width:100%;height:120px;font-size:12px;box-sizing:border-box;border-radius:10px}
.big{font-size:20px;color:#ffd86b}
</style></head><body>
<h1>🌙 표지 모으기 도우미 🔍 남은 표지 모으기</h1>
<div class="box">
<b>1. 메모장에 복사해 둔 REST API 키를 아래 칸에 붙여 넣어요.</b><br>
<small>(열쇠는 이 화면에서만 쓰이고, 어디에도 저장되거나 보내지지 않아요.)</small>
<input id="key" type="password" placeholder="여기에 열쇠 붙여 넣기 (Ctrl+V)">
<b><br>2. 버튼을 눌러요.</b><br>
<button id="go">🔍 표지 모으기 시작</button>
<div id="msg"></div><div id="bar"><i></i></div>
</div>
<div class="box" id="done" style="display:none">
<div class="big">✨ 다 모았어요!</div>
<b>3. 아래 노란 버튼을 누르고, Claude 채팅창에 붙여 넣어요. (Ctrl+V)</b><br>
<button id="copy">📋 결과 복사하기</button> <span id="copied"></span>
<textarea id="out" readonly></textarea>
</div>
<div id="grid"></div>
<script>
const BOOKS=[[248, "죽이고 싶은 아이", "이꽃님"], [249, "죽이고 싶은 아이 2", "이꽃님"], [250, "세계를 건너 너에게 갈게", "이꽃님"], [251, "여름을 한 입 베어 물었더니", "이꽃님"], [252, "친밀한 가해자", "손현주"], [253, "순례 주택", "유은실"], [254, "오백 년째 열다섯", "김혜정"], [255, "아스파라거스", "김양미"], [256, "시한부", "백은별"], [257, "구미호 식당", "박현숙"], [258, "우아한 거짓말", "김려령"], [259, "가시고백", "김려령"], [260, "훌훌", "문경민"], [261, "유원", "백온유"], [262, "천 개의 파랑", "천선란"], [263, "나인", "천선란"], [264, "알로하, 나의 엄마들", "이금이"], [265, "두근두근 내 인생", "김애란"], [266, "5번 레인", "은소홀"], [267, "위풍당당 여우 꼬리", "손원평"], [268, "복제인간 윤봉구", "임은하"], [269, "건방이의 건방진 수련기", "천효정"], [270, "몬스터 차일드", "이재문"], [271, "수상한 아파트", "박현숙"], [272, "어서 오세요, 휴남동 서점입니다", "황보름"], [273, "불편한 편의점 2", "김호연"], [274, "달러구트 꿈 백화점 2", "이미예"], [275, "피프티 피플", "정세랑"], [276, "시선으로부터,", "정세랑"], [277, "작별하지 않는다", "한강"], [278, "82년생 김지영", "조남주"], [279, "어린이라는 세계", "김소영"], [280, "나의 명랑한 생존기", "유은실"], [281, "10대를 위한 불안 세대", "조너선 하이트"], [282, "미적분의 쓸모", "한화택"], [283, "만화로 보는 3분 철학 1", "김재훈"]];
const clean=s=>(s||'').replace(/[\s:·,!?《》()\-]/g,'').toLowerCase();
async function search(key,title){
  const u='https://dapi.kakao.com/v3/search/book?target=title&size=10&query='+encodeURIComponent(title);
  const r=await fetch(u,{headers:{Authorization:'KakaoAK '+key}});
  if(!r.ok){let t='';try{t=await r.text()}catch(e){};const er=new Error('HTTP '+r.status+' '+t);er.http=r.status;throw er;}
  return (await r.json()).documents||[];
}
function pick(docs,title,author){
  const t=clean(title),a=clean(author);
  let best=null,bs=-1;
  docs.forEach((d,i)=>{ if(!d.thumbnail)return;
    let sc=0;const dt=clean(d.title);
    if(dt===t)sc+=5;else if(dt.includes(t)||t.includes(dt))sc+=3;
    const da=clean((d.authors||[]).join(''));
    if(a&&da&&(da.includes(a)||a.includes(da)||da.includes(a.slice(-2))))sc+=4;
    sc-=i*0.1;
    if(sc>bs){bs=sc;best=d;}
  });
  return best;
}
document.getElementById('go').onclick=async()=>{
  const key=document.getElementById('key').value.trim();
  const msg=document.getElementById('msg');
  if(!key){msg.textContent='❗ 열쇠를 먼저 붙여 넣어 줘요.';return;}
  const btn=document.getElementById('go');btn.disabled=true;
  const grid=document.getElementById('grid');grid.innerHTML='';
  const res={};let found=0;
  for(let i=0;i<BOOKS.length;i++){
    const [id,t,a]=BOOKS[i];
    msg.textContent=`(${i+1}/${BOOKS.length}) 《${t}》 표지 찾는 중...`;
    try{
      const d=pick(await search(key,t),t,a);
      if(d){res[id]=d.thumbnail;found++;grid.insertAdjacentHTML('beforeend',`<img src="${d.thumbnail}" title="${t}">`);}
      else{grid.insertAdjacentHTML('beforeend',`<div class="no">${t}<br>(못 찾음)</div>`);
        if(false){msg.innerHTML='❗ 책 3권이 연속으로 검색되지 않았어요.<br><b>이 화면을 사진 찍어서 Claude에게 보여 줘요.</b>';btn.disabled=false;return;}}
    }catch(e){
      let why='';
      if(e.http===401)why='열쇠가 맞지 않는 것 같아요.';
      else if(e.http===403)why='이 열쇠로 책 검색을 쓸 수 없게 막혀 있어요.';
      else if(e instanceof TypeError)why='이 컴퓨터에서 카카오로 연결이 막혔어요.';
      msg.innerHTML='❗ '+why+'<br><br><b>아래 노란 칸의 글자를 복사해서 Claude에게 보내 줘요.</b><textarea style="height:90px;background:#fff6c9">진단: '+(e.name||'')+' / '+(e.message||'').replace(/</g,'&lt;').slice(0,400)+'</textarea>';
      btn.disabled=false;return;
    }
    document.querySelector('#bar i').style.width=((i+1)/BOOKS.length*100)+'%';
    await new Promise(r=>setTimeout(r,120));
  }
  msg.textContent=`🎉 ${BOOKS.length}권 중 ${found}권의 표지를 찾았어요!`;
  document.getElementById('out').value='밤하늘책방표지3'+JSON.stringify(res);
  document.getElementById('done').style.display='block';btn.disabled=false;
};
document.getElementById('copy').onclick=async()=>{
  const o=document.getElementById('out');
  try{await navigator.clipboard.writeText(o.value);}catch(e){o.select();document.execCommand('copy');}
  document.getElementById('copied').textContent='✅ 복사했어요!';
};
</script></body></html>
